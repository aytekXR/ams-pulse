# Pulse — marketplace demo stack (real Pulse build + simulated AMS)
#
# Purpose: produce marketplace screenshots and walkthrough evidence from the REAL
# application — the Pulse binary and web UI built from this checkout, a real
# ClickHouse, the real collector / alert evaluator / notification channels — fed
# by Pulse's own AMS simulator (qa/mock-ams) and synthetic player traffic sent
# through the public beacon ingest API. Nothing here is route-mocked.
#
# What is simulated, and must be said wherever the captures are published:
#   - the Ant Media Server (qa/mock-ams speaks the AMS REST v2 wire format), and
#   - the viewers (scripted beacon sessions, including a replayed 24-hour history).
#
# Isolation (see qa/marketplace/demo-stack/README.md):
#   - fixed compose project `pulse-mktdemo`, never the prod or quickstart projects;
#   - every published port is bound to 127.0.0.1 only;
#   - secrets live in ./.env, generated by up.sh and gitignored (root `.env` rule).
#
# Usage: bash qa/marketplace/demo-stack/up.sh   (builds the image, writes .env, starts)
#        bash qa/marketplace/demo-stack/down.sh (stops and removes volumes)

name: pulse-mktdemo

services:

  clickhouse:
    # Same digest pin as deploy/quickstart/docker-compose.quickstart.yml (24.8).
    image: clickhouse/clickhouse-server@sha256:1d1f6508eba2dccce2cee9913907c5f7766327debc57a6b1991f2c9e3176c163
    environment:
      # Network access stays inside the compose network (expose only, no ports).
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    expose:
      - "9000"
      - "8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30

  # AMS simulator: emulates the AMS REST v2 surface Pulse polls, with a control API
  # (POST /control/publish|unpublish|set_viewers|set_bitrate) used by seed-demo.mjs.
  mock-ams:
    image: golang:1.25
    working_dir: /src/qa/mock-ams
    command: ["go", "run", ".", "-addr", ":9090", "-app", "LiveApp", "-rtmp-addr", ":1935"]
    environment:
      GOFLAGS: "-buildvcs=false"
    volumes:
      - ../../mock-ams:/src/qa/mock-ams:ro
      - gomod-cache:/go/pkg/mod
      - gobuild-cache:/root/.cache/go-build
    ports:
      - "127.0.0.1:${DEMO_MOCK_PORT:-19190}:9090"
      # Also reachable from OTHER compose projects on this host (the quickstart
      # verification run installs a separate stack and points --ams-url here). Bound to
      # the docker0 gateway address, never a public interface. Override the address if
      # your docker0 is not 172.17.0.1 (ip -4 addr show docker0).
      - "${DEMO_MOCK_BRIDGE_BIND:-172.17.0.1}:${DEMO_MOCK_BRIDGE_PORT:-15080}:9090"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 40

  # SMTP sink with a web UI: receives Pulse's real alert e-mails (no TLS, local only).
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${DEMO_MAILPIT_PORT:-18125}:8025"

  # Webhook sink: records every alert payload Pulse POSTs (evidence for the
  # alert-delivery walkthrough). Plain stdlib HTTP server, no dependencies.
  webhook-sink:
    image: python:3.12-slim
    command: ["python3", "/sink/webhook_sink.py"]
    volumes:
      - ./webhook_sink.py:/sink/webhook_sink.py:ro
      - webhook-log:/var/log/sink
    expose:
      - "8080"

  pulse-migrate:
    image: ${PULSE_DEMO_IMAGE:-ams-pulse:mktdemo}
    entrypoint: ["pulse", "migrate"]
    restart: "no"
    environment:
      PULSE_CLICKHOUSE_DSN: "clickhouse://clickhouse:9000/pulse"
      PULSE_CLICKHOUSE_DATABASE: "pulse"
      PULSE_MIGRATIONS_DIR: "/usr/share/pulse/migrations"
      PULSE_META_DSN: "/var/lib/pulse/pulse_meta.db"
      PULSE_SECRET_KEY: "${PULSE_SECRET_KEY}"
    volumes:
      - pulse-data:/var/lib/pulse
    depends_on:
      clickhouse:
        condition: service_healthy

  pulse:
    image: ${PULSE_DEMO_IMAGE:-ams-pulse:mktdemo}
    ports:
      - "127.0.0.1:${DEMO_PULSE_PORT:-18190}:8090"
    environment:
      PULSE_LISTEN_ADDR: ":8090"
      PULSE_LOG_LEVEL: "info"
      PULSE_CLICKHOUSE_DSN: "clickhouse://clickhouse:9000/pulse"
      PULSE_CLICKHOUSE_DATABASE: "pulse"
      PULSE_RETENTION_DAYS: "90"
      PULSE_ROLLUP_TTL_DAYS: "395"
      PULSE_AMS_URL: "http://mock-ams:9090"
      # The simulator accepts any credentials; these are placeholders, not secrets.
      PULSE_AMS_LOGIN_EMAIL: "demo-admin@example.com"
      PULSE_AMS_LOGIN_PASSWORD: "demo-password"
      PULSE_AMS_NODE_ID: "standalone"
      PULSE_POLL_INTERVAL: "5s"
      PULSE_META_DSN: "/var/lib/pulse/pulse_meta.db"
      PULSE_SECRET_KEY: "${PULSE_SECRET_KEY}"
      # Demo license: minted by qa/licensegen with a throwaway key pair (up.sh).
      PULSE_LICENSE_KEY: "${PULSE_LICENSE_KEY:-}"
      PULSE_LICENSE_PUBKEY: "${PULSE_LICENSE_PUBKEY:-}"
      PULSE_MIGRATIONS_DIR: "/usr/share/pulse/migrations"
      # Alert deep links render against a documentation domain, never a real host.
      PULSE_BASE_URL: "https://pulse.example.com"
      # Shorter anomaly tick so baselines form within a demo session (CI uses 5).
      PULSE_ANOMALY_TICK_S: "${DEMO_ANOMALY_TICK_S:-15}"
    volumes:
      - pulse-data:/var/lib/pulse
    depends_on:
      pulse-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      mock-ams:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24

volumes:
  clickhouse-data:
  pulse-data:
  gomod-cache:
  gobuild-cache:
  webhook-log:
