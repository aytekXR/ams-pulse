# XcodeGen spec for Pulse iOS app.
#
# RATIONALE: Hand-written .pbxproj files are unreviewable and drift silently.
# XcodeGen regenerates the project deterministically from this YAML, keeping the
# source of truth in a human-readable format that can be code-reviewed.
#
# ARCHITECTURE DECISION: The app is split into two layers:
#   - PulseKit (SwiftPM package): Foundation-only API client, models, formatters.
#     Builds and tests on Linux for CI verification before macOS sees it.
#   - PulseApp (this target): SwiftUI/AVKit UI layer. Compiles only on macOS/iOS.
#
# Run `xcodegen generate` in this directory to regenerate Pulse.xcodeproj.
# CI does this automatically; local developers need xcodegen installed via Homebrew.
#
# USAGE:
#   brew install xcodegen
#   cd ios && xcodegen generate
#   open Pulse.xcodeproj

name: Pulse

# -----------------------------------------------------------------------------
# Settings — defined once, referenced throughout the spec.
# Change the bundle ID or version here; they propagate to all targets.
# -----------------------------------------------------------------------------

settings:
  # Base settings applied to all targets unless overridden.
  # Swift 6 language mode is enforced at the target level via swiftSettings.
  base:
    # Marketing version displayed to users (e.g., "1.0.0").
    # CI stamps this from VERSION file or git tag via MARKETING_VERSION build arg.
    MARKETING_VERSION: "0.4.5"
    # Build number incremented per CI run (e.g., "42").
    # CI stamps this via CURRENT_PROJECT_VERSION build arg.
    CURRENT_PROJECT_VERSION: "1"
    # Bundle identifier — the one canonical place to change it.
    PRODUCT_BUNDLE_IDENTIFIER: com.beyondkaira.pulse
    # Development team — set via xcodebuild or Xcode signing settings.
    # Empty here; CI provides it via -allowProvisioningUpdates.
    DEVELOPMENT_TEAM: ""

# -----------------------------------------------------------------------------
# Options — XcodeGen project-level options.
# -----------------------------------------------------------------------------

options:
  # Use the new Xcode build system.
  defaultConfig: Release
  # Minimum deployment target for the project.
  deploymentTarget:
    iOS: "17.0"
  # Enable Swift 6 language features.
  xcodeVersion: "16.0"
  # Group sources by directory structure.
  groupSortPosition: top
  # Generate schemes automatically.
  generateEmptyDirectories: false
  # Use swift-tools-version 6.0 for local packages.
  transitivelyLinkDependencies: true

# -----------------------------------------------------------------------------
# Local Packages — SwiftPM packages in the repo.
# -----------------------------------------------------------------------------

packages:
  # PulseKit: Foundation-only API client and models.
  # This is the core logic layer, tested on Linux.
  PulseKit:
    path: PulseKit
  # PulseBeacon: Player-side QoE telemetry SDK.
  # Imported so the app can report viewer-side metrics.
  PulseBeacon:
    path: ../sdk/beacon-swift

# -----------------------------------------------------------------------------
# Targets
# -----------------------------------------------------------------------------

targets:

  # ---------------------------------------------------------------------------
  # Pulse — The iOS app target.
  # ---------------------------------------------------------------------------

  Pulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # Source files. XcodeGen recursively includes all .swift files.
    sources:
      - path: PulseApp/Sources/PulseApp
        # Exclude build artifacts and generated files.
        excludes:
          - "**/.build/**"
          - "**/*.generated.swift"
      # Privacy manifest — required since May 2024 for App Store/TestFlight.
      - path: PulseApp/PrivacyInfo.xcprivacy

    # Dependencies — local SwiftPM packages.
    dependencies:
      - package: PulseKit
      - package: PulseBeacon

    # Build settings for this target.
    settings:
      base:
        # App-specific settings.
        PRODUCT_NAME: Pulse
        # Use custom Info.plist for App Transport Security configuration.
        # ATS NSAllowsLocalNetworking enables HTTP for local network addresses
        # (192.168.*, 10.*, localhost, .local) — required for self-hosted Pulse
        # servers on development/LAN networks. Does NOT blanket-disable ATS.
        INFOPLIST_FILE: PulseApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Bundle ID from project settings.
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        # Versioning from project settings.
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        # Swift 6 strict concurrency.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Enable module stability for future ABI compatibility.
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        # App Transport Security: require HTTPS (good default).
        # If a dev server is needed, add exception domains in Info.plist.
        # iOS 17+ defaults to secure connections.
        # Asset catalog for app icon and colors.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Code signing — CI overrides with CODE_SIGNING_ALLOWED=NO for simulator builds.
        CODE_SIGN_STYLE: Automatic
        # Enable testability in Debug for UI tests.
        ENABLE_TESTABILITY: YES
        # Hardened runtime for App Store submission.
        ENABLE_HARDENED_RUNTIME: YES
        # Support iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Info.plist keys are now defined in PulseApp/Info.plist directly.
        # This was changed to support App Transport Security configuration
        # (NSAllowsLocalNetworking for self-hosted servers on local networks).

    # Pre/post build scripts — none for now, but structure is ready.
    # Scripts are commonly used for:
    #   - Linting (SwiftLint)
    #   - Code generation (Sourcery)
    #   - Build number stamping

    # Scheme configuration — XcodeGen auto-generates a scheme.
    # Custom scheme settings can override here if needed.

  # ---------------------------------------------------------------------------
  # PulseTests — Unit tests for the iOS app layer.
  #
  # The target name is "PulseTests" (not "PulseAppTests") to match the CI
  # workflow's -only-testing:PulseTests flag in .github/workflows/ios.yml.
  #
  # ⚠ THREE NAMES ARE IN PLAY HERE AND THEY ARE NOT THE SAME NAME:
  #     directory     PulseApp/Tests/PulseAppTests   (where the files live)
  #     test target   PulseTests                     (what CI runs)
  #     MODULE        Pulse                          (what the tests import)
  #   The app target is Pulse with PRODUCT_NAME Pulse, so its Swift module is
  #   "Pulse" — the tests must say `@testable import Pulse`. Importing PulseApp
  #   (the directory name, which reads like the obvious answer) fails with
  #   "Unable to find module dependency: 'PulseApp'" only on macOS, so nothing on
  #   the Linux side can catch it. It cost one CI round-trip; do not re-introduce it.
  # ---------------------------------------------------------------------------

  PulseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: PulseApp/Tests/PulseAppTests
        excludes:
          - "**/.build/**"

    dependencies:
      - target: Pulse

    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # The test BUNDLE needs its own Info.plist, and unlike the app target it
        # has no hand-written one — so let Xcode synthesise it. This is only
        # required because CI ad-hoc signs the simulator build (it must, or the
        # Keychain tests get -34018), and signing a bundle with no Info.plist
        # fails with "Cannot code sign because the target does not have an
        # Info.plist file". With signing off the whole question never arises,
        # which is why this was not needed until the Keychain tests were fixed.
        GENERATE_INFOPLIST_FILE: YES
        # Test host is the Pulse app.
        # XcodeGen doc anchor: "Test Target Settings" in ProjectSpec.md.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pulse.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pulse"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # ---------------------------------------------------------------------------
  # PulseUITests — XCUITest target for UI automation and screenshot capture.
  #
  # RATIONALE (D-188/D-189): Every screen except CONNECT has never been seen
  # running. They compile; that is the entire basis for believing they work.
  # XCUITest drives the real app through real controls, pointed at a local
  # fixture server, and takes screenshots as evidence.
  #
  # ⚠ This is NOT a unit test target. It is a UI test bundle that:
  #   - Launches the full app in the simulator
  #   - Drives it via accessibility identifiers
  #   - Does NOT have access to internal app types
  #
  # The test target is named PulseUITests (matching scheme and directory).
  # ---------------------------------------------------------------------------

  PulseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: PulseApp/UITests
        excludes:
          - "**/.build/**"
          - "**/Fixtures/**"
      # The identifier constants are COMPILED INTO BOTH TARGETS rather than
      # duplicated. A UI test runs out of process and cannot import the app, so
      # the alternative is a second hand-maintained copy of every identifier
      # string — and a test that looks for an identifier the app stopped setting
      # fails in a way that looks like a UI regression instead of like drift.
      # One file, two targets, no second source of truth.
      - path: PulseApp/Sources/PulseApp/AccessibilityIdentifiers.swift

    dependencies:
      - target: Pulse

    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        # UI test target — runs against the installed app, not as a bundle loader.
        TEST_TARGET_NAME: Pulse
        PRODUCT_BUNDLE_IDENTIFIER: com.beyondkaira.pulse.uitests

# -----------------------------------------------------------------------------
# Schemes — Auto-generated by XcodeGen.
# Override specific scheme settings here if needed.
# -----------------------------------------------------------------------------

schemes:
  Pulse:
    build:
      targets:
        Pulse: all
    run:
      config: Debug
      # Enable Address Sanitizer in Debug for catching memory issues.
      # Disabled by default; uncomment to enable.
      # environmentVariables:
      #   ASAN_OPTIONS: detect_leaks=1
    test:
      config: Debug
      targets:
        - PulseTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # UI test scheme — builds the app and UI test target, runs XCUITests.
  # CI uses this scheme for the "Run UI tests" step.
  PulseUITests:
    build:
      targets:
        Pulse: all
        PulseUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PulseUITests
    profile:
      config: Release
    analyze:
      config: Debug

# -----------------------------------------------------------------------------
# File Groups — organize non-source files in the project navigator.
# -----------------------------------------------------------------------------

fileGroups:
  - ../README.md
  - ../CHANGELOG.md
  - project.yml
