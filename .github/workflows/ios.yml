# Pulse iOS CI — validates PulseKit on Linux, builds PulseApp on macOS, uploads to TestFlight.
#
# ARCHITECTURE DECISION (ios/PULSEKIT-CONTRACT.md): The iOS app is split into two layers:
#   - PulseKit: Foundation-only API client, models, formatters. Builds on Linux.
#   - PulseApp: SwiftUI/AVKit UI layer. Builds only on macOS/iOS.
#
# This split means logic bugs surface in the fast Linux job (ios-kit) before the
# expensive macOS runner spins up. Only the thin UI layer requires Xcode.
#
# PATH FILTER DECISION: This workflow does NOT use a paths filter.
#
# A paths filter would skip this workflow on PRs that don't touch ios/. But ios-kit
# is a REQUIRED status check in branch-protection.sh. A required check that never
# runs on an unrelated PR blocks that PR forever — GitHub shows the check as "pending"
# and merge is impossible. The standard workaround (a no-op job with the same name
# that runs when paths don't match) would require a matrix or complex conditionals.
#
# Cost-benefit: ios-kit runs in ~30s (container pull + swift build/test); ios-app
# adds ~2-3 minutes on a macOS runner. The total ~3 minute tax on unrelated PRs is
# acceptable vs. the complexity and failure modes of a path-filtered required check.
#
# If build times become problematic, the correct fix is: remove ios-kit from the
# required contexts list and add a no-op companion job. Do NOT add a paths filter
# to a required check without that companion — it blocks all unrelated PRs.
#
# TESTFLIGHT RELEASE TAG PATTERN: ios-v* (e.g., ios-v0.1.0, ios-v1.0.0-beta.1).
# This pattern is distinct from the product release tags (v*) consumed by release.yml.
# The product tags ship the backend image to GHCR; the ios-v* tags ship the iOS app
# to TestFlight. Different cadences, different artifact, no collision.
name: ios

on:
  push:
    branches: [main]
    tags:
      - "ios-v*"
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR. iOS builds are expensive (macOS
# runner time), so canceling stale runs saves quota.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  # ── 1. ios-kit ──────────────────────────────────────────────────────────────
  # HARD GATE: validates the Foundation-only logic layer on Linux.
  # This catches model/API/formatting bugs before the macOS runner starts.
  # Runs in the official Swift 6.1 container (same image family as sdk-swift in ci.yml).
  # This job is in the required status checks list in branch-protection.sh.
  ios-kit:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4

      - name: Build PulseKit
        run: cd ios/PulseKit && swift build

      - name: Test PulseKit (HARD)
        run: cd ios/PulseKit && swift test

  # ── 2. ios-app ──────────────────────────────────────────────────────────────
  # Builds PulseApp on macOS with Xcode. Proves the SwiftUI layer compiles and
  # tests pass (when test targets exist). Uses XcodeGen to generate the project.
  #
  # RUNNER: macos-15 (GitHub-hosted, free for public repositories).
  #
  # XCODE PIN: Xcode 26.2.0.
  # RATIONALE: Apple requires Xcode 26+ with iOS 26 SDK for all App Store Connect
  # uploads since 2026-04-28 (docs/mobile/ci-runner-facts.md). The macos-15 runner
  # (image 20260715.0234) has Xcode 26.0 through 26.3.0 installed. We pin 26.2.0
  # specifically because:
  #   1. It is not the oldest (avoids early-release bugs fixed in 26.1+).
  #   2. It is not the newest (26.3.0 may be unstable; let others find issues).
  #   3. The ios-testflight job uses the same pin, so build and upload use the
  #      same compiler — no "it built locally" surprises.
  # The pin is ASSERTED: the step prints xcodebuild -version and fails if the
  # major version is not 26. A pin without assertion is a comment.
  #
  # DESTINATION: "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro".
  # RATIONALE: Xcode 26.2 ships with iOS 26.2 SDK and simulator. The macos-15
  # runner has iOS 18.5, 18.6, 26.0, 26.1, 26.2 runtimes (docs/mobile/ci-runner-facts.md).
  # Pairing Xcode 26.2 with iOS 26.2 simulator matches the SDK used for archiving.
  # iPhone 17 Pro is verified present. The destination is ASSERTED: xcrun simctl
  # resolves it before building; if it fails, the step prints a clear message.
  #
  # NOT IN REQUIRED CONTEXTS: This job depends on third-party runner images and
  # Homebrew availability. Adding it to required checks would make every merge
  # dependent on Homebrew uptime and Apple's simulator versioning decisions. It
  # is still a real gate on main; it just cannot hold a PR hostage to a third
  # party. Same rationale as compose-boot exclusion in branch-protection.sh.
  ios-app:
    runs-on: macos-15
    needs: ios-kit
    steps:
      - uses: actions/checkout@v4

      # Pin Xcode version and ASSERT the selection.
      - name: Select and assert Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.0.app/Contents/Developer
          XCODE_VERSION=$(xcodebuild -version | head -1)
          echo "Selected: $XCODE_VERSION"
          MAJOR=$(echo "$XCODE_VERSION" | grep -oE '^Xcode [0-9]+' | grep -oE '[0-9]+')
          if [ "$MAJOR" != "26" ]; then
            echo "::error::Xcode major version is $MAJOR, expected 26. The pin is stale or incorrect."
            exit 1
          fi
          echo "Xcode assertion PASSED: major version is 26"

      # Assert the destination exists before building.
      - name: Assert simulator destination exists
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-26-2"
          DEVICE="iPhone 17 Pro"
          echo "Looking for runtime: $RUNTIME"
          echo "Looking for device: $DEVICE"
          xcrun simctl list runtimes
          xcrun simctl list devices
          # Check runtime exists
          if ! xcrun simctl list runtimes | grep -q "iOS 26.2"; then
            echo "::error::iOS 26.2 runtime not found. Check docs/mobile/ci-runner-facts.md and update the destination."
            exit 1
          fi
          # Check device exists for this runtime
          if ! xcrun simctl list devices available | grep -q "$DEVICE"; then
            echo "::error::Device '$DEVICE' not found. Check docs/mobile/ci-runner-facts.md and update the destination."
            exit 1
          fi
          echo "Destination assertion PASSED: iOS 26.2 runtime and $DEVICE are available"
          echo "Resolved destination: platform=iOS Simulator,OS=26.2,name=$DEVICE"

      # XcodeGen generates Pulse.xcodeproj from project.yml.
      # Homebrew is pre-installed on macos-15 runners.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
          ls -la Pulse.xcodeproj/

      # Resolve the local Swift packages (PulseKit, PulseBeacon) before building.
      # xcodebuild -resolvePackageDependencies ensures packages are fetched and
      # linked correctly. Without this, incremental builds sometimes fail to find
      # the local package products.
      - name: Resolve Swift packages
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies \
            -project Pulse.xcodeproj \
            -scheme Pulse

      # Build for iOS Simulator, AD-HOC SIGNED.
      #
      # ⚠ Do not "simplify" this back to CODE_SIGNING_ALLOWED=NO. That is the
      # obvious setting for a CI simulator build and it silently breaks the
      # Keychain: an unsigned app has no keychain access group, so every
      # SecItem call returns -34018 (errSecMissingEntitlement) and all twelve
      # KeychainServiceTests fail with an error that says nothing about signing.
      # It cost a CI round-trip to find. An iOS SIMULATOR build needs no team and
      # no provisioning profile — the ad-hoc identity "-" is enough, and it is
      # what gives the app its default keychain access group.
      #
      # Destination is spelled out so a missing simulator fails LOUD.
      # -quiet is deliberately NOT used — on failure we need the whole log.
      - name: Build for iOS Simulator
        run: |
          cd ios
          xcodebuild build \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES

      # Run tests. The scheme's test action is configured in project.yml.
      # The test target is named PulseTests in project.yml (its SOURCES live in
      # PulseApp/Tests/PulseAppTests — directory name and target name differ, so
      # do not "correct" one to match the other). If no tests are
      # found, that is a BUG, not an expected state — the build must fail so
      # someone adds tests. Exit code 66 ("no tests found") is NOT swallowed.
      # Ad-hoc signed for the same reason as the build step above — the Keychain
      # tests are the ones that care, and they are the ones worth having.
      - name: Test (HARD)
        run: |
          cd ios
          xcodebuild test \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES

      # ────────────────────────────────────────────────────────────────────────────
      # UI TESTS: Drive the real app through every screen via XCUITest.
      #
      # RATIONALE (D-188): The app only ever reaches the CONNECT screen in CI
      # because nothing supplies a server. Every other screen — live dashboard,
      # streams, alerts, settings, the AVPlayer view — has NEVER BEEN SEEN.
      # They compile. That is the entire basis on which they are believed to work.
      #
      # SOLUTION: A local fixture server serves realistic JSON for all
      # PulseAPIClient endpoints. XCUITest drives the connect form with
      # localhost:8090 and the fixture token, navigates every tab, and takes
      # screenshots. The screenshots are uploaded as an artifact.
      #
      # CONSTRAINT (hard): No runtime backdoor in the app binary. The fixture
      # server is the only instrumentation; the app code path is identical to
      # production. XCUITest lives in a separate test target that is never part
      # of the app binary.
      # ────────────────────────────────────────────────────────────────────────────

      # Start the fixture server in the background. The server writes a ready file
      # when it is listening; we poll for that file rather than sleeping.
      - name: Start fixture server
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          export FIXTURE_SERVER_READY_FILE="$RUNNER_TEMP/fixture/ready"
          python3 ios/PulseApp/UITests/Fixtures/fixture_server.py --port 8090 &
          echo $! > "$RUNNER_TEMP/fixture/pid"
          # Wait for the ready file (max 30s). Fail loud if the server never starts.
          for i in {1..30}; do
            if [ -f "$RUNNER_TEMP/fixture/ready" ]; then
              echo "Fixture server is ready (waited ${i}s)"
              break
            fi
            sleep 1
          done
          if [ ! -f "$RUNNER_TEMP/fixture/ready" ]; then
            echo "::error::Fixture server did not start within 30s. Check fixture_server.py for errors."
            exit 1
          fi
          # Verify it responds.
          if ! curl -sf http://localhost:8090/healthz >/dev/null; then
            echo "::error::Fixture server started but /healthz is not responding."
            exit 1
          fi
          echo "Fixture server verified at http://localhost:8090"

      # Run UI tests. These are in a separate scheme (PulseUITests) that
      # builds the app and the UI test target, installs both in the simulator,
      # and drives the app through XCUITest.
      - name: Run UI tests
        run: |
          cd ios
          xcodebuild test \
            -project Pulse.xcodeproj \
            -scheme PulseUITests \
            -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro" \
            -resultBundlePath "$RUNNER_TEMP/UITestResults.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES

      # Stop the fixture server.
      - name: Stop fixture server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fixture/pid" ]; then
            PID=$(cat "$RUNNER_TEMP/fixture/pid")
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" || true
              echo "Fixture server (pid $PID) stopped"
            fi
          fi

      # Extract screenshots from the .xcresult bundle.
      #
      # ⚠ xcresulttool's interface changed in recent Xcode and this step has no
      # way to be sure which spelling the runner's version accepts — there is no
      # Xcode on the machine this was written on. So it TRIES the modern form,
      # falls back to the legacy form, and then ASSERTS that PNGs actually
      # appeared. The previous version swallowed the exit code with `|| echo
      # warning` and then listed the (empty) output directory, which meant a
      # green job could ship zero screenshots — and screenshots are the entire
      # product of this job.
      - name: Extract UI test screenshots
        id: shots
        if: always()
        run: |
          set +e
          RESULT_BUNDLE="$RUNNER_TEMP/UITestResults.xcresult"
          OUT="$RUNNER_TEMP/ui-screenshots"
          mkdir -p "$OUT"
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "::warning::No UITestResults.xcresult found — the UI tests did not get far enough to produce one."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "── attempt 1: modern export"
          xcrun xcresulttool export attachments \
            --path "$RESULT_BUNDLE" --output-path "$OUT" 2>&1 | tail -20

          if [ -z "$(find "$OUT" -name '*.png' -type f 2>/dev/null)" ]; then
            echo "── attempt 2: legacy export"
            xcrun xcresulttool export --legacy \
              --path "$RESULT_BUNDLE" --output-path "$OUT" --type directory 2>&1 | tail -20
          fi

          COUNT=$(find "$OUT" -name '*.png' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Extracted $COUNT screenshot(s):"
          find "$OUT" -name '*.png' -type f | sort
          if [ "$COUNT" = "0" ]; then
            # Print the tool's own interface so the next iteration is informed by
            # the runner rather than by a guess made on a Linux box.
            echo "── xcresulttool interface on this runner, for the next attempt:"
            xcrun xcresulttool export --help 2>&1 | head -40
          fi
          exit 0

      # Screenshots missing while the tests PASSED means extraction is broken and
      # nobody would notice — the job would be green and the artifact empty. If the
      # tests failed, the job is already red and a warning is enough.
      - name: Fail if a passing UI test run produced no screenshots
        if: success() && steps.shots.outputs.count == '0'
        run: |
          echo "::error::UI tests passed but no screenshots were extracted from the xcresult bundle."
          echo "See the 'xcresulttool interface on this runner' output in the previous step."
          exit 1

      # Upload UI test screenshots as an artifact.
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          retention-days: 14
          if-no-files-found: warn

  # ── 3. ios-testflight ───────────────────────────────────────────────────────
  # Archives PulseApp and uploads to TestFlight.
  #
  # TRIGGERS:
  #   - workflow_dispatch: Manual trigger for ad-hoc uploads.
  #   - push to ios-v* tag: Automated release upload.
  #
  # TAG PATTERN: ios-v* (e.g., ios-v0.1.0, ios-v1.0.0-beta.1).
  # This is distinct from the product release tags (v*) used by release.yml.
  # The product tags ship the backend Docker image; the ios tags ship the iOS app.
  #
  # SECRETS REQUIRED (must be configured in GitHub → Settings → Secrets):
  #   - APP_STORE_CONNECT_ISSUER_ID: The Issuer ID (UUID) from App Store Connect.
  #   - APP_STORE_CONNECT_KEY_ID: The Key ID (10 alphanumeric characters).
  #   - APP_STORE_CONNECT_PRIVATE_KEY: The .p8 file contents VERBATIM — the whole
  #     file, including the BEGIN PRIVATE KEY and END PRIVATE KEY lines. NOT
  #     base64-wrapped.
  #
  #     ⚠ This encoding is not a free choice. The upload action below takes the
  #     key as a PKCS8 STRING and there is no decode step in front of it, so the
  #     secret has to be usable as-is. It was previously documented as
  #     base64-encoded while ALSO being handed to that action raw — the two uses
  #     disagreed, and the failure would have landed on the operator's very first
  #     upload attempt with an opaque parse error.
  #
  #   - APPLE_TEAM_ID (optional): the 10-character Team ID. Passed to xcodebuild as
  #     DEVELOPMENT_TEAM when present. Automatic signing can usually infer the team
  #     from the API key when the key belongs to exactly one team; if it cannot,
  #     the archive fails with "Signing for Pulse requires a development team" and
  #     this secret is the fix. UNVERIFIED either way — nobody here has an Apple
  #     account to test it against.
  #
  # If secrets are missing, the job SKIPS with a loud notice — it never fails
  # silently and never succeeds silently. This allows CI to run without an Apple
  # account configured while making the gap obvious.
  #
  # BUILD NUMBER: Set from GITHUB_RUN_NUMBER. App Store Connect rejects duplicate
  # build numbers for the same version, and a collision is a slow, confusing
  # failure. Using the run number guarantees uniqueness across CI runs.
  #
  # UPLOAD MECHANISM: Apple-Actions/upload-testflight-build with backend: appstore-api.
  # This is Apple's official GitHub Action, actively maintained (verified via WebFetch
  # 2026-07-28). The appstore-api backend uses the App Store Connect API directly
  # and works on macOS runners. This is the modern path; xcrun altool is deprecated
  # for notarization (replaced by notarytool) and the App Store Connect API is the
  # recommended CI upload method. The action handles authentication via the API key.
  #
  # NOT IN REQUIRED CONTEXTS: This job only runs on ios-v* tags and dispatch,
  # never on PRs. Adding it to required checks would make it "pending" on PRs
  # forever. It is still a real gate on main for iOS releases.
  ios-testflight:
    runs-on: macos-15
    needs: [ios-kit, ios-app]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')
    steps:
      - uses: actions/checkout@v4

      # Check for required secrets BEFORE doing any work.
      # If any are missing, skip loudly with an explanatory notice.
      - name: Check App Store Connect credentials
        id: creds
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          MISSING=""
          if [ -z "$ASC_ISSUER_ID" ]; then
            MISSING="${MISSING}APP_STORE_CONNECT_ISSUER_ID "
          fi
          if [ -z "$ASC_KEY_ID" ]; then
            MISSING="${MISSING}APP_STORE_CONNECT_KEY_ID "
          fi
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            MISSING="${MISSING}APP_STORE_CONNECT_PRIVATE_KEY "
          fi
          if [ -n "$MISSING" ]; then
            echo "::notice::SKIPPING TestFlight upload — missing secrets: ${MISSING}"
            echo "::notice::See docs/mobile/ios-testflight.md for setup instructions."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # All remaining steps are gated on credentials being available.
      - name: Select and assert Xcode 26.2
        if: steps.creds.outputs.available == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.0.app/Contents/Developer
          XCODE_VERSION=$(xcodebuild -version | head -1)
          echo "Selected: $XCODE_VERSION"
          MAJOR=$(echo "$XCODE_VERSION" | grep -oE '^Xcode [0-9]+' | grep -oE '[0-9]+')
          if [ "$MAJOR" != "26" ]; then
            echo "::error::Xcode major version is $MAJOR, expected 26. The pin is stale or incorrect."
            exit 1
          fi
          echo "Xcode assertion PASSED: major version is 26"

      - name: Install XcodeGen
        if: steps.creds.outputs.available == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.creds.outputs.available == 'true'
        run: |
          cd ios
          xcodegen generate

      - name: Resolve Swift packages
        if: steps.creds.outputs.available == 'true'
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies \
            -project Pulse.xcodeproj \
            -scheme Pulse

      # Compute version strings for the build.
      - name: Compute version
        if: steps.creds.outputs.available == 'true'
        id: version
        run: |
          # Marketing version from tag (ios-v1.0.0 -> 1.0.0) or VERSION file.
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            MARKETING_VERSION="${GITHUB_REF#refs/tags/ios-v}"
          else
            MARKETING_VERSION="$(cat VERSION)"
          fi
          # Build number from run number — guaranteed unique across CI runs.
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Marketing version: ${MARKETING_VERSION}"
          echo "Build number: ${BUILD_NUMBER}"

      # Write the App Store Connect API key to a file for xcodebuild.
      - name: Install App Store Connect API key
        if: steps.creds.outputs.available == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          # Fail here, with a sentence that says what to do, rather than 200 lines
          # later inside xcodebuild's signing machinery.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEYFILE"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not look like a .p8 key." \
                 "Store the file contents VERBATIM, including the BEGIN/END lines — not base64."
            exit 1
          fi
          echo "Installed API key AuthKey_${ASC_KEY_ID}.p8"

      # Archive for App Store distribution with automatic signing.
      # -allowProvisioningUpdates with the API key enables automatic signing
      # without manual provisioning profile management.
      - name: Archive for App Store
        if: steps.creds.outputs.available == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          # DEVELOPMENT_TEAM only when the operator supplied one. Passing an EMPTY
          # value is not the same as passing nothing: it pins the setting to blank
          # and defeats the inference that -allowProvisioningUpdates would
          # otherwise do from the API key's own team.
          TEAM_ARG=()
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            TEAM_ARG=(DEVELOPMENT_TEAM="${APPLE_TEAM_ID}")
            echo "Signing with team ${APPLE_TEAM_ID}"
          else
            echo "::notice::APPLE_TEAM_ID not set — relying on the API key's team. If this step fails with 'requires a development team', set that secret."
          fi
          xcodebuild archive \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -archivePath "$RUNNER_TEMP/Pulse.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            MARKETING_VERSION="${{ steps.version.outputs.MARKETING_VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.BUILD_NUMBER }}" \
            "${TEAM_ARG[@]}"
          echo "Archive created at $RUNNER_TEMP/Pulse.xcarchive"

      # Export the archive as an App Store IPA.
      - name: Export App Store IPA
        if: steps.creds.outputs.available == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          # Create export options plist for App Store distribution.
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pulse.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          echo "IPA exported to $RUNNER_TEMP/Export"
          ls -la "$RUNNER_TEMP/Export"

      # Upload to App Store Connect using Apple's official GitHub Action.
      # This action uses the App Store Connect API directly (appstore-api backend).
      # Verified 2026-07-28: Apple-Actions/upload-testflight-build is actively
      # maintained and the appstore-api backend is recommended for .ipa uploads.
      # The exported filename follows PRODUCT_NAME, so it should be Pulse.ipa —
      # but "should be" is how a job fails at the last step of a ten-minute run.
      # Resolve it, assert exactly one, and hand the real path onward.
      - name: Locate the exported IPA
        id: ipa
        if: steps.creds.outputs.available == 'true'
        run: |
          COUNT=$(find "$RUNNER_TEMP/Export" -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')
          if [ "$COUNT" != "1" ]; then
            echo "::error::expected exactly one .ipa in $RUNNER_TEMP/Export, found $COUNT"
            ls -la "$RUNNER_TEMP/Export" || true
            exit 1
          fi
          IPA=$(find "$RUNNER_TEMP/Export" -maxdepth 1 -name '*.ipa')
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Uploading $IPA"

      # ⚠ The version pin here is load-bearing. This was written as @v3, which
      # does NOT EXIST — the action publishes v4 and v5 only, so the job would
      # have died at "Unable to resolve action". The claim that the action was
      # "verified 2026-07-28" was true of the ACTION and false of the VERSION.
      # Re-check the tag list before bumping: gh api repos/Apple-Actions/upload-testflight-build/tags
      - name: Upload to TestFlight
        if: steps.creds.outputs.available == 'true'
        uses: Apple-Actions/upload-testflight-build@v5.2.1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # Matches ITSAppUsesNonExemptEncryption=false in Info.plist. Declaring it
          # here too stops TestFlight parking the build on "Missing Compliance",
          # which blocks testers from installing it until someone clicks through.
          uses-non-exempt-encryption: "false"

      # Print where the operator should look for the build.
      - name: Print TestFlight location
        if: steps.creds.outputs.available == 'true'
        run: |
          echo "============================================================"
          echo "TestFlight upload complete."
          echo ""
          echo "The build is now processing at App Store Connect."
          echo "Processing typically takes 10-30 minutes."
          echo ""
          echo "To find this build:"
          echo "  1. Go to https://appstoreconnect.apple.com/"
          echo "  2. Click 'My Apps' > 'Pulse' (or your app name)"
          echo "  3. Click 'TestFlight' in the sidebar"
          echo "  4. Look under 'Builds' for version ${{ steps.version.outputs.MARKETING_VERSION }} (${{ steps.version.outputs.BUILD_NUMBER }})"
          echo ""
          echo "Once processing completes, add the build to a tester group"
          echo "to make it available for download."
          echo "============================================================"

  # ── 4. ios-simulator-artifact ───────────────────────────────────────────────
  # Uploads a simulator .app bundle as a workflow artifact on pushes to main.
  #
  # WHY THIS EXISTS: TestFlight requires an Apple Developer account that may not
  # be configured yet. But a tester or reviewer with a Mac can run a simulator
  # .app TODAY — no Apple account, no signing, no provisioning. This bridges
  # the gap between "the code exists" and "you can see it running."
  #
  # LIMITATION: A simulator build does NOT run on a physical iPhone. It runs
  # only in the iOS Simulator on a Mac with Xcode installed. Most testers do
  # not have a Mac; this is a fallback for those who do, not a replacement for
  # TestFlight.
  #
  # HOW TO USE THE ARTIFACT:
  #   1. Download the artifact from the workflow run's "Artifacts" section.
  #   2. Unzip it: unzip Pulse-Simulator.zip
  #   3. Boot a simulator: xcrun simctl boot "iPhone 17 Pro"
  #   4. Install the app: xcrun simctl install booted Pulse.app
  #   5. Launch: xcrun simctl launch booted com.beyondkaira.pulse
  #   Or: drag and drop Pulse.app onto an already-running Simulator window.
  #
  # TRIGGER: pushes to main only. PRs do not upload artifacts (saves storage).
  # The job still runs on PRs (reuses ios-app build), just skips the upload.
  #
  # RETENTION: 14 days. Artifacts are large (~50 MB zipped) and mainly useful
  # for the most recent builds. Older builds can be rebuilt if needed.
  #
  # NOT IN REQUIRED CONTEXTS: same reasons as ios-app.
  ios-simulator-artifact:
    runs-on: macos-15
    needs: ios-app
    # main pushes produce the downloadable build; workflow_dispatch exists so this
    # job can be exercised on a branch BEFORE it is merged. Without that, the only
    # way to test a change to this job is to merge it to a protected branch and
    # find out — which is how a smoke test that never ran gets called a smoke test.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Select and assert Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.0.app/Contents/Developer
          XCODE_VERSION=$(xcodebuild -version | head -1)
          echo "Selected: $XCODE_VERSION"
          MAJOR=$(echo "$XCODE_VERSION" | grep -oE '^Xcode [0-9]+' | grep -oE '[0-9]+')
          if [ "$MAJOR" != "26" ]; then
            echo "::error::Xcode major version is $MAJOR, expected 26. The pin is stale or incorrect."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies \
            -project Pulse.xcodeproj \
            -scheme Pulse

      # Build for simulator. The build products land in DerivedData.
      # We use a known DerivedData path so we can find the .app afterward.
      - name: Build for iOS Simulator
        run: |
          cd ios
          xcodebuild build \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES

      # Locate the .app bundle. It should be in Build/Products/Debug-iphonesimulator/.
      - name: Locate simulator app bundle
        id: app
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "Pulse.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find Pulse.app in DerivedData"
            find "$RUNNER_TEMP/DerivedData" -name "*.app" -type d || true
            exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app at: $APP_PATH"

      # ── SMOKE: actually RUN the thing ────────────────────────────────────────
      #
      # Everything before this point proves the app COMPILES and that its unit
      # tests pass. Neither of those has ever launched it. An iOS app can build
      # clean, pass every test, and still terminate on the first frame — a missing
      # asset catalog entry, a bad Info.plist key, a @main that throws, a SwiftUI
      # crash in body evaluation. None of that is visible to xcodebuild.
      #
      # So: boot a simulator, install, launch, wait, screenshot, and fail if the
      # system wrote a crash report for us. The screenshot is uploaded because a
      # PASS here means "did not crash", which is NOT the same as "shows the right
      # thing" — and this repo has a standing rule that a capture is only evidence
      # once a human has opened it.
      - name: Boot simulator
        run: |
          set -x
          xcrun simctl bootstatus "iPhone 17 Pro" -b
          xcrun simctl list devices booted

      - name: Install and launch
        id: launch
        run: |
          APP="${{ steps.app.outputs.path }}"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle id: $BUNDLE_ID"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

          # Clear any crash reports predating this run so the check below cannot
          # be tripped by someone else's ghost.
          rm -rf ~/Library/Logs/DiagnosticReports/* || true

          xcrun simctl install booted "$APP"
          xcrun simctl launch booted "$BUNDLE_ID"

          # Give SwiftUI time to evaluate the first real frame. A crash in body
          # evaluation happens after launch returns a pid, so checking the pid
          # immediately would report success on an app that is already dying.
          sleep 12

      # ⚠ SET THE APPEARANCE BEFORE **EVERY** CAPTURE, never once and never never.
      #
      # The first version of this step captured immediately after launch, called
      # that shot the default, then switched to light and captured again. A
      # simulator BOOTS IN LIGHT, so both files were light and one of them was
      # named as if it were not. Nothing failed; the artifact simply asserted
      # something untrue, which is the failure mode this repo has a standing rule
      # about — a capture is not evidence until a human opens it, and a MISLABELLED
      # capture is worse than none because opening it confirms the wrong thing.
      #
      # The sleep after each switch is load-bearing: the appearance change
      # propagates asynchronously and a screenshot taken too soon catches the old
      # rendering, which reintroduces the same lie by a different route.
      - name: Capture screenshots (both appearances, each one pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/shots"

          xcrun simctl ui booted appearance dark
          sleep 4
          xcrun simctl io booted screenshot "$RUNNER_TEMP/shots/01-launch-dark.png"

          xcrun simctl ui booted appearance light
          sleep 4
          xcrun simctl io booted screenshot "$RUNNER_TEMP/shots/02-launch-light.png"

          # Prove the two captures actually DIFFER. If a future change breaks the
          # appearance switch, identical bytes are the tell — and this assertion is
          # the only thing standing between that and two files that look fine.
          if cmp -s "$RUNNER_TEMP/shots/01-launch-dark.png" "$RUNNER_TEMP/shots/02-launch-light.png"; then
            echo "::error::The dark and light screenshots are byte-identical — the appearance switch did not take effect, so one of these files is mislabelled."
            exit 1
          fi
          echo "Dark and light captures differ, as they must."
          ls -la "$RUNNER_TEMP/shots"

      - name: Fail if the app crashed
        run: |
          # A .ips in DiagnosticReports naming our binary is an unambiguous crash.
          CRASHES=$(find ~/Library/Logs/DiagnosticReports -name "Pulse*.ips" 2>/dev/null || true)
          if [ -n "$CRASHES" ]; then
            echo "::error::The app crashed on launch. Reports:"
            echo "$CRASHES"
            for c in $CRASHES; do echo "─── $c"; head -60 "$c"; done
            exit 1
          fi
          # And it must still be running: a clean early exit is also a failure for
          # an app whose whole job is to stay on screen.
          if ! xcrun simctl spawn booted launchctl list 2>/dev/null | grep -q "${{ steps.launch.outputs.bundle_id }}"; then
            echo "::error::The app is not running 12s after launch, and left no crash report."
            echo "Running processes:"
            xcrun simctl spawn booted launchctl list 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "App is alive and left no crash report."

      - name: Upload launch screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14

      # Zip and upload. The zip contains the .app directory itself.
      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Simulator
          path: ${{ steps.app.outputs.path }}
          retention-days: 14
          if-no-files-found: error
