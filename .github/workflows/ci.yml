# Pulse CI — validates contracts, builds all components, runs tests.
# Hardened: go 1.25, node 22, GHCR lowercase, no soft-fail lint, real integration tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Contracts ─────────────────────────────────────────────────────────────
  # Source of truth — validate first; everything else depends on this job.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schemas (ajv draft2020)
        run: |
          npx --yes ajv-cli compile --spec=draft2020 --strict=false \
            -s contracts/events/ams-server-event.schema.json \
            -s contracts/events/beacon-event.schema.json \
            -s contracts/events/alert-notification.schema.json
      - name: Lint OpenAPI spec (redocly)
        # path-parameters-defined skipped: {channelId} param missing in skeleton
        # contract; INT-01 will fix in wave-1 contract freeze (D-004).
        run: |
          npx --yes @redocly/cli lint --skip-rule=path-parameters-defined \
            contracts/openapi/pulse-api.yaml

  # ── 2. Server ─────────────────────────────────────────────────────────────────
  server:
    runs-on: ubuntu-latest
    needs: contracts
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/?query=SELECT+1 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_meta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # D-053: the tree is fully gofmt'd (go1.25 reflow); any gofmt -l output fails.
      - name: gofmt gate
        run: |
          cd server
          DIRTY=$(gofmt -l .)
          if [ -n "$DIRTY" ]; then
            echo "FAIL: files need gofmt (run gofmt -w with go1.25):"
            echo "$DIRTY"
            exit 1
          fi
          echo "OK: gofmt clean"

      # CGO_ENABLED=0 is required for vet + build (pure-Go modernc.org/sqlite).
      - name: Vet (CGO_ENABLED=0)
        run: cd server && CGO_ENABLED=0 go vet ./...

      - name: Build (CGO_ENABLED=0)
        run: cd server && CGO_ENABLED=0 go build ./...

      # Race detector requires CGO (gcc is present on ubuntu-latest).
      # Do NOT set CGO_ENABLED=0 here — -race is incompatible with pure-Go CGO=0.
      - name: Unit tests with race detector
        run: cd server && go test ./... -race -timeout 300s -coverprofile=/tmp/cover.out -covermode=atomic

      # D-045: coverage no-regression ratchet. Floor sits just below the current
      # total (73.3% as of D-061; ratcheted 55→58 in D-053, 58→62 in D-059,
      # 62→66 in D-060, 66→70 in D-061 per ROADMAP §4) so accidental
      # deletions/regressions fail CI. Raise FLOOR as coverage climbs (GA target
      # ≥68 — exceeded). Non-integration run (query & store/clickhouse full paths
      # are covered separately by integration).
      - name: Coverage floor gate
        run: |
          cd server
          TOTAL=$(go tool cover -func=/tmp/cover.out | awk '/^total:/ {gsub("%","",$NF); print $NF}')
          FLOOR=70.2
          awk -v t="$TOTAL" -v f="$FLOOR" 'BEGIN {
            if (t+0 < f+0) { printf "FAIL: total coverage %.1f%% < floor %.1f%%\n", t, f; exit 1 }
            printf "OK: total coverage %.1f%% >= floor %.1f%%\n", t, f
          }'

      # qa/mock-ams and qa/licensegen each have their own go.mod and are NOT
      # covered by `./...` in server/ — run them here so e2e infra changes are
      # gated by their own unit tests (mock-ams pagination coverage from WO-4).
      - name: qa modules unit tests
        run: |
          (cd qa/mock-ams && go test -race -count=1 -timeout 300s ./...)
          (cd qa/licensegen && go test -race -count=1 -timeout 300s ./...)

      # ── Integration step ─────────────────────────────────────────────────────
      # Build the binary and smoke-test pulse migrate against the CH service container.
      - name: Build pulse binary
        # The Go module lives in server/ (no go.mod/go.work at repo root), so this
        # MUST build from server/ — `go build ./server/cmd/pulse` from the repo root
        # fails with "go: cannot find main module".
        run: cd server && CGO_ENABLED=0 go build -o /tmp/pulse ./cmd/pulse

      - name: Run migrations (pulse migrate — smoke-test against CH service)
        env:
          PULSE_CLICKHOUSE_DSN: "clickhouse://localhost:9000/pulse"
          PULSE_MIGRATIONS_DIR: "contracts/db/clickhouse"
          # D-052 fail-closed guard: migrate refuses to boot without a >=16-byte
          # secret key (non-:memory: meta DSN). CI-only dummy value, no secrets here.
          PULSE_SECRET_KEY: "ci-migrate-smoke-dummy-key-0123456789abcdef"
        run: /tmp/pulse migrate

      # Integration tests self-manage a ClickHouse subprocess: they look for
      # /tmp/clickhouse via testutil.RequireClickHouseBin — absent + CI=true
      # fails LOUD (D-065 WO-D, D-028-class defence); absent locally still skips.
      # Download v26.6.1 so they run on every push/PR.
      # The tests do NOT use PULSE_CLICKHOUSE_DSN — they start CH on random ports.
      - name: Download ClickHouse binary for integration tests
        # PINNED to a specific release (D-040) for DETERMINISTIC CI. The old
        # builds.clickhouse.com/master URL served a rolling build that changed between runs
        # (master drifted 26.6.1 -> 26.7.1.281), a non-deterministic dependency. GitHub ships
        # the static binary inside clickhouse-common-static-*.tgz; extract it from there.
        run: |
          CH_VER=26.6.1.1193
          curl -fsSL -o /tmp/ch.tgz \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v${CH_VER}-stable/clickhouse-common-static-${CH_VER}-amd64.tgz"
          tar -xf /tmp/ch.tgz -C /tmp
          cp "$(find /tmp -type f -name clickhouse -path '*/bin/*' | head -1)" /tmp/clickhouse
          chmod +x /tmp/clickhouse
          /tmp/clickhouse --version

      - name: Integration tests
        env:
          PULSE_CLICKHOUSE_DSN: "clickhouse://localhost:9000/pulse"
          PULSE_MIGRATIONS_DIR: "contracts/db/clickhouse"
          PULSE_META_TEST_PG_DSN: "postgres://pulse:pulse@localhost:5432/pulse_meta_test?sslmode=disable"
        run: cd server && go test -tags integration ./... -timeout 300s

  # ── 3. Web ───────────────────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd web && npm ci --legacy-peer-deps

      # Types-drift guard: regenerate schema.d.ts and fail if it differs from
      # the committed version (prevents stale generated types slipping in).
      - name: Generate API types and check for drift
        # NB: after `cd web` the diff path is relative to web/ — it must be
        # src/lib/... (not web/src/...), else git errors "ambiguous argument".
        run: |
          cd web
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts

      - name: Build web UI
        run: cd web && npm run build

      # Hard failure — eslint.config.js is present (no '|| echo GAP' soft-skip).
      - name: Lint (HARD)
        run: cd web && npm run lint

      - name: Test
        run: cd web && npm test

  # ── 3b. JavaScript dependency vulnerabilities ────────────────────────────────
  # WHY THIS EXISTS: the release pipeline blocks on Go and OS-package CVEs via
  # Trivy, but Trivy scans the IMAGE — OS packages plus the compiled Go binary.
  # The web UI's npm dependencies are bundled into JS assets that Trivy does not
  # analyse, so npm advisories were entirely ungated. That gap shipped a real
  # one: react-router 7.18.1 carried GHSA-qwww-vcr4-c8h2 (HIGH) for weeks while
  # every gate stayed green, and it was found only by running npm audit by hand.
  # A marketplace security reviewer runs exactly that command.
  #
  # SCOPE: production dependencies, HIGH and above, for every package.json that
  # ships code (web UI + the beacon SDK that customers embed in their players).
  # Dev dependencies are REPORTED but do not fail the build — they never reach a
  # user — so a dev-only advisory does not block a release, but nobody can claim
  # they did not know about it.
  #
  # WHEN THIS GOES RED ON AN UNRELATED PR: that is the advisory database moving,
  # not your change. Fix the dependency; do not raise --audit-level to paper over
  # it. If a finding is genuinely not exploitable here, that argument belongs in
  # the changelog with the reasoning, not in a silenced gate.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit production dependencies (HARD — high and above)
        run: |
          set -euo pipefail
          FAILED=0
          for dir in web sdk/beacon-js; do
            echo "::group::npm audit --omit=dev --audit-level=high ($dir)"
            if ! (cd "$dir" && npm audit --omit=dev --audit-level=high); then
              echo "FAIL: $dir has a HIGH or CRITICAL advisory in a SHIPPED dependency"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          [ "$FAILED" -eq 0 ] || exit 1
          echo "OK: no high/critical advisories in shipped dependencies"

      - name: Audit dev dependencies (report only — never fails the build)
        continue-on-error: true
        run: |
          for dir in web sdk/beacon-js; do
            echo "::group::npm audit (all deps, $dir)"
            (cd "$dir" && npm audit || true)
            echo "::endgroup::"
          done

      # THIRD-PARTY-LICENSES.md is a legal attribution document and it is
      # GENERATED, not written, so it cannot claim a licence a dependency does
      # not carry. The generator has always had a --check mode that fails when
      # the file is stale — but nothing ever ran it, so the guarantee was
      # theoretical. It was silently stale as soon as a dependency changed.
      # Regenerating needs the Go module cache and node_modules, hence the setup
      # below rather than a bare script call.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install dependencies for the licence scan
        run: |
          (cd web && npm ci --legacy-peer-deps)
          (cd sdk/beacon-js && npm ci)
          (cd server && go mod download)

      - name: Third-party licence attribution is current (HARD)
        run: |
          if ! scripts/gen-third-party-licenses.sh --check; then
            echo
            echo "FAIL: THIRD-PARTY-LICENSES.md does not match the dependency tree."
            echo "A dependency was added, removed or bumped without regenerating it."
            echo "Fix: scripts/gen-third-party-licenses.sh  (then commit the result)"
            exit 1
          fi

  # ── 4. SDK ───────────────────────────────────────────────────────────────────
  sdk:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd sdk/beacon-js && npm ci

      - name: Build beacon SDK
        run: cd sdk/beacon-js && npm run build

      # The unit test cannot see the tsup output (vitest injects its own define),
      # so the BUILT artifact is asserted here: the version literal must be
      # substituted and no unsubstituted define may remain (REVIEW-MP3 N7).
      - name: Assert dist carries package.json version (HARD)
        run: |
          cd sdk/beacon-js
          V="$(node -p 'require("./package.json").version')"
          grep -q "\"$V\"" dist/index.js || { echo "FAIL: dist/index.js missing version literal \"$V\" — tsup define lost"; exit 1; }
          if grep -q "__SDK_VERSION__" dist/index.js; then
            echo "FAIL: unsubstituted __SDK_VERSION__ in dist/index.js"; exit 1
          fi
          echo "dist version literal: PASS ($V)"

      # Hard 15 KB gzip gate (PRD §7, ADR-0003).
      - name: Size gate (15 KB gzip — HARD)
        run: cd sdk/beacon-js && npm run size

      # Hard failure — eslint.config.js is present (no '|| echo GAP' soft-skip).
      - name: Lint (HARD)
        run: cd sdk/beacon-js && npm run lint

      - name: Test (HARD)
        run: cd sdk/beacon-js && npm test

  # ── 4b. iOS beacon SDK (Swift) ────────────────────────────────────────────────
  # Cross-platform core builds + tests on Linux (Foundation + Dispatch only); the
  # iOS-only lifecycle hook is behind `#if canImport(UIKit)`. Runs in the official
  # Swift container since ubuntu-latest has no Swift toolchain preinstalled.
  sdk-swift:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS beacon SDK (cross-platform core)
        run: cd sdk/beacon-swift && swift build

      - name: Test (HARD)
        run: cd sdk/beacon-swift && swift test

  # ── 5. Docker build ──────────────────────────────────────────────────────────
  # Prove the all-in-one Dockerfile builds end-to-end (build context = repo root).
  # Version stamping: build-args inject VERSION/COMMIT/BUILD_DATE via ldflags so
  # `pulse version` inside the container prints real values instead of dev/unknown.
  docker-build:
    runs-on: ubuntu-latest
    needs: [server, web, sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Compute version build-args
        id: ver
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "version=ci-${SHORT_SHA}"
            echo "commit=${SHORT_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build all-in-one image (version-stamped)
        run: |
          docker build \
            -f deploy/docker/pulse.Dockerfile \
            --build-arg VERSION="${{ steps.ver.outputs.version }}" \
            --build-arg COMMIT="${{ steps.ver.outputs.commit }}" \
            --build-arg BUILD_DATE="${{ steps.ver.outputs.build_date }}" \
            -t ghcr.io/aytekxr/ams-pulse:ci \
            .

      - name: Assert stamped version (mutation-proof vs dev/unknown)
        # Runs `pulse version` via the real binary (not `pulse serve version`).
        # If ldflags were removed the binary would report "pulse dev (commit unknown...)"
        # and this step would fail — that is the mutation guard.
        run: |
          OUT="$(docker run --rm --entrypoint pulse ghcr.io/aytekxr/ams-pulse:ci version)"
          echo "pulse version output: $OUT"
          if [ -z "$OUT" ]; then
            echo "FAIL: pulse version produced no output — nothing was validated"
            exit 1
          fi
          if echo "$OUT" | grep -qE '\bdev\b|unknown'; then
            echo "FAIL: version output contains 'dev' or 'unknown' — ldflags not applied"
            exit 1
          fi
          echo "OK: version is stamped correctly"

  # ── 6. Helm ──────────────────────────────────────────────────────────────────
  # Lint + golden-file template diff.
  # D-002: no cluster available — template diff is the validation mechanism.
  # QA-01 must validate on a real cluster before this AC is fully green.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      - name: helm lint (zero failures required)
        run: |
          helm lint deploy/helm/pulse/
          echo "helm lint: PASS"

      - name: helm template — default values
        run: |
          helm template pulse deploy/helm/pulse/ > /tmp/golden-default.yaml
          echo "helm template (default): rendered $(wc -l < /tmp/golden-default.yaml) lines"

      - name: helm template — postgres + s3 values
        run: |
          helm template pulse deploy/helm/pulse/ \
            -f deploy/helm/tests/values-postgres-s3.yaml \
            > /tmp/golden-postgres-s3.yaml
          echo "helm template (postgres+s3): rendered $(wc -l < /tmp/golden-postgres-s3.yaml) lines"

      - name: helm template — external ClickHouse values
        run: |
          helm template pulse deploy/helm/pulse/ \
            -f deploy/helm/tests/values-external-clickhouse.yaml \
            > /tmp/golden-external-clickhouse.yaml
          echo "helm template (external-clickhouse): rendered $(wc -l < /tmp/golden-external-clickhouse.yaml) lines"

      - name: helm template — ClickHouse persistence off
        run: |
          helm template pulse deploy/helm/pulse/ \
            -f deploy/helm/tests/values-ch-persistence-off.yaml \
            > /tmp/golden-ch-persistence-off.yaml
          echo "helm template (ch-persistence-off): rendered $(wc -l < /tmp/golden-ch-persistence-off.yaml) lines"

      - name: helm template — ClickHouse existing secret
        run: |
          helm template pulse deploy/helm/pulse/ \
            -f deploy/helm/tests/values-existing-secret.yaml \
            > /tmp/golden-existing-secret.yaml
          echo "helm template (existing-secret): rendered $(wc -l < /tmp/golden-existing-secret.yaml) lines"

      - name: Golden-file diff (catch template regressions)
        run: |
          FAIL=0
          diff deploy/helm/tests/golden-default.yaml /tmp/golden-default.yaml \
            || { echo "FAIL: golden-default.yaml drift"; FAIL=1; }
          diff deploy/helm/tests/golden-postgres-s3.yaml /tmp/golden-postgres-s3.yaml \
            || { echo "FAIL: golden-postgres-s3.yaml drift"; FAIL=1; }
          diff deploy/helm/tests/golden-external-clickhouse.yaml /tmp/golden-external-clickhouse.yaml \
            || { echo "FAIL: golden-external-clickhouse.yaml drift"; FAIL=1; }
          diff deploy/helm/tests/golden-ch-persistence-off.yaml /tmp/golden-ch-persistence-off.yaml \
            || { echo "FAIL: golden-ch-persistence-off.yaml drift"; FAIL=1; }
          diff deploy/helm/tests/golden-existing-secret.yaml /tmp/golden-existing-secret.yaml \
            || { echo "FAIL: golden-existing-secret.yaml drift"; FAIL=1; }
          [ $FAIL -eq 0 ] && echo "Golden-file diff: PASS (no drift)" || exit 1

      - name: D-002 limitation note
        run: |
          echo "NOTE(D-002): helm install/upgrade not run — no cluster available in dev env."
          echo "  QA-01 must validate chart on a real cluster before Helm AC is fully green."

  # ── 8. Web e2e (Playwright) ──────────────────────────────────────────────────
  # Chromium-only, API route-mocked via page.route — no backend needed.
  # HARD GATE since D-162 (§2.7): promoted after a sustained job-level green streak
  # (7/7 recent main runs at promotion). Do not re-soften; fix flakes at the spec.
  # D-042 reminder: a wait that never resolves is a deterministic bug — never bump timeouts.
  web-e2e:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd web && npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (chromium + system deps)
        run: cd web && npx playwright install chromium --with-deps

      - name: Build web UI
        run: cd web && npm run build

      - name: Run Playwright e2e tests
        run: cd web && npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  # ── 7. Compose ───────────────────────────────────────────────────────────────
  # Config-level validation of both the base file and the CI override.
  # A sibling agent authors deploy/docker-compose.ci.yml.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate base compose config
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          echo "docker compose (base): PASS"

      - name: Validate CI override compose config
        # PULSE_SECRET_KEY is :?-required by the CI override (sourced from the CI env
        # at e2e bring-up, never committed / never from .env). Provide a throwaway
        # value so config-only validation passes on a clean runner.
        env:
          PULSE_SECRET_KEY: ci-config-validation-dummy
        run: |
          docker compose \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.ci.yml \
            config --quiet
          echo "docker compose (CI override): PASS"

      # Merged base+hardened semantics (REVIEW-MP3 N3): compose merges environment
      # maps per-key, so the base file's CLICKHOUSE_SKIP_USER_SETUP=1 survives into
      # the hardened stack unless the overlay explicitly neutralizes it — with the
      # flag active the named ClickHouse user is never provisioned, the hardened
      # (authenticated) healthcheck fails forever, and pulse never starts.
      - name: Assert merged base+hardened enforces ClickHouse auth
        env:
          PULSE_SECRET_KEY: ci-config-validation-dummy-16b
          CLICKHOUSE_USER: ci_dummy_user
          CLICKHOUSE_PASSWORD: ci-dummy-password
        run: |
          MERGED="$(docker compose \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.hardened.yml \
            config)"
          printf '%s' "$MERGED" | grep -q 'CLICKHOUSE_USER' \
            || { echo "FAIL: merged hardened config lost CLICKHOUSE_USER"; exit 1; }
          printf '%s' "$MERGED" | grep -q 'CLICKHOUSE_PASSWORD' \
            || { echo "FAIL: merged hardened config lost CLICKHOUSE_PASSWORD"; exit 1; }
          # No service in the merged hardened stack may keep the skip flag ACTIVE
          # (the overlay neutralizes it to the empty string, which renders as '').
          if printf '%s' "$MERGED" | grep -E 'CLICKHOUSE_SKIP_USER_SETUP: .*1' >/dev/null; then
            echo "FAIL: CLICKHOUSE_SKIP_USER_SETUP is still active in the merged hardened config"
            exit 1
          fi
          echo "docker compose (base+hardened merged auth): PASS"

  # ── 9. Shellcheck ────────────────────────────────────────────────────────────
  # Validates deploy shell scripts for portability and common errors.
  # install.sh, pulse-backup.sh, and deployment.sh are cheaply coverable.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck

      # ⚠ SCOPE IS DISCOVERED, NOT LISTED — and that is the whole point.
      #
      # This guard used to be a hand-maintained list of six paths, and the list
      # drifted twice. D-187 found website/tests/run-checks.sh (780 lines, gates
      # the public website) unguarded since the session that wrote it. A later
      # sweep found THREE more the list had never covered, one of which ships to
      # customers inside the Helm chart:
      #   - deploy/helm/pulse/files/pulse-backup.sh  (shipped in the chart)
      #   - scripts/gen-third-party-licenses.sh      (generates a legal document)
      #   - .github/branch-protection.sh             (mutates repo security settings)
      # Each previous fix appended the one file that round happened to name, which
      # is why it kept recurring. So the guard now DISCOVERS every tracked *.sh
      # under the directories that ship or gate, and a new script is covered the
      # moment it is committed.
      #
      # WHAT THIS DOES NOT COVER, and why (write gaps down inside the guard):
      #   - qa/**  — the live-AMS test harness (~80 scripts, 678 style notes, zero
      #     errors). These never ship and never gate a merge; enrolling them would
      #     mean a 678-finding cleanup for no safety gain. If a qa/ script ever
      #     becomes load-bearing, move it out of qa/ or add it explicitly.
      #   - brandkit/** — frozen third-party design export, not ours to edit.
      #   - Files with a shell shebang but no .sh extension. Checked at the time of
      #     writing: the only match in the tree is a .sh.example fixture. If you add
      #     an extensionless script, it is NOT covered — give it a .sh extension.
      #
      # The failing branch is exercised deliberately: see the "negative test" step.
      - name: Shellcheck every shipped and gating script
        run: |
          set -euo pipefail
          # Directory pathspecs + a suffix filter, NOT a '**/*.sh' glob: git's
          # pathspec '**' requires an intervening directory, so 'scripts/**/*.sh'
          # silently misses scripts/gen-third-party-licenses.sh and both
          # .github/*.sh. That mistake was made and caught while writing this.
          mapfile -t SCRIPTS < <(git ls-files -- deploy scripts .github website \
            | grep '\.sh$' | sort)
          # Floor assertion: the hand-maintained list this replaced had 6 entries
          # and the discovered set must never fall below it. A glob that silently
          # matches nothing would otherwise read as a green guard.
          if [ "${#SCRIPTS[@]}" -lt 6 ]; then
            echo "FAIL: discovery found only ${#SCRIPTS[@]} scripts (expected >= 6)."
            echo "The pathspec is broken, not the tree — do not 'fix' this by lowering the floor."
            exit 1
          fi
          echo "Checking ${#SCRIPTS[@]} scripts:"
          printf '  %s\n' "${SCRIPTS[@]}"
          shellcheck "${SCRIPTS[@]}"

      # A guard that has never been seen to fail is not known to work. This plants
      # a script with an unambiguous defect in a covered directory, asserts the
      # guard rejects it, and removes it. If this step ever passes silently, the
      # guard above has stopped guarding.
      - name: Negative test — the guard must reject a bad script
        run: |
          set -uo pipefail
          BAD=deploy/scripts/__shellcheck_negative_test__.sh
          printf '#!/usr/bin/env bash\nif [ $x = 1 ]; then echo hi; fi\n' > "$BAD"
          if shellcheck "$BAD" >/dev/null 2>&1; then
            rm -f "$BAD"
            echo "FAIL: shellcheck accepted a script with an unquoted undefined variable"
            exit 1
          fi
          rm -f "$BAD"
          echo "OK: the guard rejects a defective script"

  # ── 11. Doc "Last updated" stamp guard ───────────────────────────────────────
  # Stamp drift is this repo's most-repeated defect class — external review
  # rounds 7, 8, 9 and 10 each filed an instance, and each fix was scoped to the
  # one file that round happened to name, so the next round found it somewhere
  # else. Rationale, both checks, and an explicit list of what they do NOT cover
  # live at the top of .github/check-doc-stamps.sh.
  #
  # fetch-depth: 0 is required — check B diffs the PR range against the base to
  # assert that a change to a stamped doc also moved its stamp.
  doc-stamps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check doc stamps
        run: |
          BASE="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          git rev-parse --verify --quiet "$BASE" >/dev/null || BASE=""
          .github/check-doc-stamps.sh $BASE

  # ── 10. Compose boot smoke ───────────────────────────────────────────────────
  # Boots the base deploy/docker-compose.yml (the exact README evaluator command)
  # with the pinned public GHCR image and asserts that:
  #   • pulse responds HTTP 200 at /healthz
  #   • clickhouse component status == "ok" (validates CLICKHOUSE_SKIP_USER_SETUP)
  #   • meta_store component status == "ok" (validates SQLite bootstrap)
  #   • collector may be "ok" or "degraded" (no AMS in CI — collector without a
  #     live snapshot degrades gracefully; NEVER whole-body grep for "ok")
  # Uses docker compose exec to reach the expose:-only port 8090 from inside the
  # Docker network without publishing it to the host.
  # Poll with a deadline loop — no fixed sleep.
  compose-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release-cut window: the cut commit repoints the image pin to the NEW
      # version before the tag exists, so the pinned tag is unpublishable-yet by
      # construction — pulling it can only fail until release.yml pushes it.
      #
      # REVIEW-MP3-R14: deferring by SKIPPING was the wrong remedy. The release
      # gate requires a green `ci` run for the very SHA being tagged, and on that
      # SHA the pin always equals VERSION — so the README evaluator path was never
      # booted against any state that actually got released, and after a failed
      # release every later main run kept deferring too. Now the deferral path
      # BUILDS the image locally and boots the same compose file against it: the
      # boot is still exercised, only the registry round-trip is skipped.
      # Any missing pin that does NOT equal VERSION (typo, deleted tag) still
      # fails hard.
      - name: Check pinned image is published (build locally during release-cut window)
        id: pin
        run: |
          PIN=$(grep -oEm1 'ams-pulse:[0-9]+\.[0-9]+\.[0-9]+' deploy/docker-compose.yml | cut -d: -f2)
          echo "pin=${PIN}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "ghcr.io/aytekxr/ams-pulse:${PIN}" >/dev/null 2>&1; then
            echo "mode=published" >> "$GITHUB_OUTPUT"
            echo "pinned tag ${PIN} is published — booting the published image"
          elif [ "$PIN" = "$(cat VERSION)" ]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "::notice::pinned tag ${PIN} == VERSION and not yet on GHCR (release-cut window) — building it locally so the boot test still runs"
          else
            echo "FAIL: pinned tag ${PIN} is not on GHCR and != VERSION ($(cat VERSION)) — broken image pin"
            exit 1
          fi

      # Build the pinned tag locally so `docker compose up` resolves it from the
      # local daemon instead of the registry. Same tag string the compose file
      # pins, so the compose file under test is byte-identical to the shipped one.
      - name: Build pinned image locally (release-cut window)
        if: steps.pin.outputs.mode == 'local'
        run: |
          docker build \
            -f deploy/docker/pulse.Dockerfile \
            -t "ghcr.io/aytekxr/ams-pulse:${{ steps.pin.outputs.pin }}" \
            --build-arg VERSION="${{ steps.pin.outputs.pin }}" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      # Boots the EXACT command README documents, including the evaluator overlay.
      # Booting the base file alone (as this job used to) proved the containers
      # start but not that an evaluator can reach the UI — the base file is
      # expose:-only and explicit -f flags suppress docker-compose.override.yml,
      # so the documented command produced a healthy stack with an unreachable UI.
      - name: Boot compose stack (README evaluator path)
        env:
          PULSE_SECRET_KEY: ci-boot-smoke-key-0123456789abcdef01234567
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.evaluator.yml \
            up -d --wait --wait-timeout 120

      # Reaches the UI the way an evaluator does — over the PUBLISHED host port,
      # not via `docker compose exec` into the container network.
      - name: Assert the UI is reachable on the published host port
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8090/healthz >/dev/null 2>&1; then
              echo "PASS: /healthz reachable on the published host port"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: http://localhost:8090/healthz unreachable from the host — the documented evaluator command does not publish the UI"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.evaluator.yml ps
          exit 1

      - name: Assert /healthz — HTTP 200 and component-scoped status
        run: |
          BODY=$(docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.evaluator.yml exec -T pulse \
            wget -qO- http://localhost:8090/healthz)
          echo "healthz response: $BODY"
          echo "$BODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          comps = d.get('components', {})
          ch        = comps.get('clickhouse', {}).get('status', 'missing')
          meta      = comps.get('meta_store', {}).get('status', 'missing')
          collector = comps.get('collector', {}).get('status', 'missing')
          overall   = d.get('status', 'missing')
          print('overall={} clickhouse={} meta_store={} collector={}'.format(
              overall, ch, meta, collector))
          assert ch == 'ok',                      'FAIL: clickhouse status=' + ch
          assert meta == 'ok',                    'FAIL: meta_store status=' + meta
          assert collector in ('ok', 'degraded'), 'FAIL: collector status=' + collector
          assert overall in ('ok', 'degraded'),   'FAIL: overall status=' + overall
          print('PASS: /healthz component checks')
          "

      - name: Tear down compose stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.evaluator.yml down -v

  slack-notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [contracts, server, web, sdk, docker-build, helm, web-e2e, compose, shellcheck, compose-boot]
    if: always()
    steps:
      - name: Notify Slack on success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          MSG=${MSG:-"(no commit message)"}
          TEXT=$(printf '✅ Build succeeded\n\nRepo: %s\nWorkflow: %s\nTime: %s\nCommit: %s - %s' \
            "${GITHUB_REPOSITORY##*/}" "$GITHUB_WORKFLOW" "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "${GITHUB_SHA:0:7}" "$MSG")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- \
              "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack success notification failed"

      - name: Notify Slack on failure
        if: ${{ contains(needs.*.result, 'failure') }}
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          MSG=${MSG:-"(no commit message)"}
          FAILED_JOBS=$(printf '%s' "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          TEXT=$(printf '❌ Build failed\n\nRepo: %s\nWorkflow: %s\nJob: %s\nBranch: %s\nActor: %s\nCommit: %s - %s\nRun: %s\nTime: %s' \
            "${GITHUB_REPOSITORY##*/}" "$GITHUB_WORKFLOW" "$FAILED_JOBS" "$GITHUB_REF_NAME" "$GITHUB_ACTOR" \
            "${GITHUB_SHA:0:7}" "$MSG" \
            "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- \
              "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack failure notification failed"
