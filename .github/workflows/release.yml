# Pulse release workflow — CI-gated, multi-arch, Trivy-scanned, SBOM/provenance, cosign-signed.
#
# What this pipeline guarantees:
#   1. Released commit has a passing CI run (contracts + server + web + sdk + docker-build).
#   2. Image is scanned by Trivy; any FIXABLE HIGH/CRITICAL CVE blocks the release.
#   3. On tag push: multi-arch (amd64 + arm64) image pushed to GHCR with SBOM + provenance.
#   4. On tag push: image signed with cosign keyless (Sigstore / GitHub OIDC).
#
# Dry-run (build + scan only, no push, no sign):
#   gh workflow run release.yml -f version=0.0.0-dry
#
# Verify a released image:
#   cosign verify \
#     --certificate-identity-regexp '^https://github\.com/aytekXR/ams-pulse/\.github/workflows/release\.yml@refs/tags/v.+$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/aytekxr/ams-pulse:X.Y.Z
#   (the regexp is ANCHORED on purpose — review round 6, H-05. Cosign matches
#    --certificate-identity-regexp UNANCHORED, so a bare 'github.com/aytekXR/ams-pulse'
#    also accepts any other workflow, any branch/PR ref, and any repo path that merely
#    starts the same way. Keep the anchors, the escaped dots, and refs/tags/v.)
#   (image tags have NO v prefix — git tag vX.Y.Z publishes image tag X.Y.Z;
#    verified live D-070 addendum: 0.2.0 digest 9c6c1204…, Rekor logIndex 2128354996)
#
#   ⚠ REQUIRES A COSIGN v3+ CLIENT (D-178). cosign-installer@v4 installs cosign v3,
#   which publishes the signature as an OCI 1.1 referrer instead of the legacy
#   `sha256-<digest>.sig` tag. A v2 client therefore prints "Error: no signatures
#   found" against a perfectly signed image — verified 2026-07-27 against 0.4.3:
#   cosign v2.4.3 FAILS, cosign v3.0.2 PASSES (same digest 75a76c67…727b4).
#   The 0.2.0-era `.sig` tags in the registry are the legacy layout and are why
#   the D-070 verification above passed with a v2 client at the time.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (dry-run: build+scan only, no push/sign)"
        required: false
        default: "0.0.0-dry"
        type: string
      publish_tag:
        description: "Existing tag to checkout and publish to npm (e.g. v0.4.1); requires NPM_TOKEN secret"
        required: false
        default: ""
        type: string

permissions:
  contents: write  # create/upload GitHub Releases
  packages: write
  id-token: write  # cosign keyless + npm provenance: OIDC token for Sigstore
  actions: read    # CI-gate: gh api query for workflow runs

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Guard check #16 resolves the previous tag with `git describe --tags`, which
          # needs full history AND tags. The default shallow depth-1 checkout has
          # neither, so PREV_TAG came back empty and #16 silently no-opped on every
          # release (external review round 4, F-09).
          fetch-depth: 0
          fetch-tags: true

      # ── Checkout specific tag (dispatch npm-publish path) ──────────────────────────
      # When a caller supplies publish_tag on workflow_dispatch, re-checkout that ref
      # so the workspace matches the release being published.
      - name: Checkout publish tag (dispatch npm-publish path)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_tag }}

      # ── CI gate ────────────────────────────────────────────────────────────────────
      # Block the release unless the WORKSPACE commit has at least one successful
      # 'ci' workflow run. Runs on BOTH tag push and workflow_dispatch.
      # NOTE: git rev-parse HEAD, NOT ${GITHUB_SHA} — on the publish_tag dispatch
      # path the previous step re-checked-out the tag, while GITHUB_SHA still
      # points at the dispatch branch HEAD; gating on GITHUB_SHA would certify
      # the wrong commit (S105 adversarial-review finding).
      # Mutation proof: if no ci run exists for the SHA → total_count=0 → exit 1.
      - name: CI gate — require successful ci and e2e runs for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GATE_SHA=$(git rev-parse HEAD)
          COUNT=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GATE_SHA}&status=success&per_page=1" \
            -q '.total_count')
          [ "$COUNT" -ge 1 ] || { echo "FAIL: no successful ci run for ${GATE_SHA}"; exit 1; }
          echo "CI gate: PASS (${COUNT} successful ci run(s) for ${GATE_SHA})"
          E2E_COUNT=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e.yml/runs?head_sha=${GATE_SHA}&status=success&per_page=1" \
            -q '.total_count')
          [ "$E2E_COUNT" -ge 1 ] || { echo "FAIL: no successful e2e run for ${GATE_SHA}"; exit 1; }
          echo "E2E gate: PASS (${E2E_COUNT} successful e2e run(s) for ${GATE_SHA})"

      # ── Version consistency guard (tag push only) ──────────────────────────────────
      # Asserts VERSION file, Chart.yaml appVersion, and doc header stamps all match
      # the pushed tag.  A mismatch here means a pre-release checklist step was skipped.
      - name: Version consistency guard
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          # 1. VERSION file
          FILE_VERSION="$(cat VERSION)"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "FAIL: VERSION file ($FILE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

          # 2. Helm Chart appVersion
          CHART_VERSION="$(grep '^appVersion:' deploy/helm/pulse/Chart.yaml \
            | sed 's/appVersion:[[:space:]]*//; s/\"//g')"
          if [ "$CHART_VERSION" != "$TAG_VERSION" ]; then
            echo "FAIL: Chart.yaml appVersion ($CHART_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

          # 3. Doc header stamps — grep only the first 40 lines of each file to
          #    avoid false positives from changelog entries further down the doc.
          #    An EMPTY stamp is a failure too: otherwise restructuring a doc
          #    header would silently degrade this guard to a no-op for that file.
          TAG_STAMP="v${TAG_VERSION}"
          for doc in docs/product.md docs/faq.md docs/known-limitations.md; do
            DOC_STAMP="$(head -40 "$doc" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
            if [ -z "$DOC_STAMP" ] || [ "$DOC_STAMP" != "$TAG_STAMP" ]; then
              echo "FAIL: $doc carries '${DOC_STAMP:-<no version stamp in first 40 lines>}', expected $TAG_STAMP — update the doc header before tagging"
              exit 1
            fi
          done

          # 4. SDK package version — the npm-publish step below ships whatever
          #    sdk/beacon-js/package.json says; it must match the tag.
          PKG_VERSION="$(node -p "require('./sdk/beacon-js/package.json').version")"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "FAIL: sdk/beacon-js/package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

          # 5. Deploy-surface image-tag pins — every evaluator/operator install path
          #    must pin the image being released; stale pins cause evaluators to pull the
          #    old image while thinking they have the new one.
          for f in \
            deploy/docker-compose.yml \
            deploy/quickstart/docker-compose.quickstart.yml; do
            if ! grep -q "ams-pulse:${TAG_VERSION}" "$f" 2>/dev/null; then
              echo "FAIL: $f does not contain image pin ams-pulse:${TAG_VERSION} — update before tagging"
              exit 1
            fi
          done

          # 6. Helm values.yaml image tag (first tag: key is the image tag;
          #    indent-agnostic so a values re-indent can't blind this check)
          HELM_TAG="$(grep -E '^[[:space:]]*tag:' deploy/helm/pulse/values.yaml | head -1 \
            | sed 's/.*tag:[[:space:]]*//; s/\"//g')"
          if [ "$HELM_TAG" != "$TAG_VERSION" ]; then
            echo "FAIL: deploy/helm/pulse/values.yaml image tag ($HELM_TAG) != tag ($TAG_VERSION)"
            exit 1
          fi

          # 7. Helm README example tag (doc table default value)
          if ! grep -q "pulse\.image\.tag.*${TAG_VERSION}" deploy/helm/pulse/README.md 2>/dev/null; then
            echo "FAIL: deploy/helm/pulse/README.md pulse.image.tag table entry does not show ${TAG_VERSION} — update before tagging"
            exit 1
          fi

          # 8. install.sh PULSE_IMAGE default
          if ! grep -q "ams-pulse:${TAG_VERSION}" deploy/quickstart/install.sh 2>/dev/null; then
            echo "FAIL: deploy/quickstart/install.sh PULSE_IMAGE default does not contain ${TAG_VERSION} — update before tagging"
            exit 1
          fi

          # 9. install.sh PULSE_REF default must be v${TAG_VERSION} at cut time.
          #    Between releases the deploy lane sets PULSE_REF to 'main'; the cut
          #    flips it to the release tag so raw.githubusercontent.com downloads
          #    pin to the tagged tree, not a moving main branch.
          if ! grep -q "PULSE_REF:-v${TAG_VERSION}" deploy/quickstart/install.sh 2>/dev/null; then
            echo "FAIL: deploy/quickstart/install.sh PULSE_REF default is not v${TAG_VERSION} — flip it from 'main' before tagging"
            exit 1
          fi

          # 10. Swift beacon SDK version constant
          SWIFT_VER="$(grep 'pulseBeaconSDKVersion' sdk/beacon-swift/Sources/PulseBeacon/Types.swift \
            | grep -oE '"[^"]+"' | tr -d '"' || true)"
          if [ "$SWIFT_VER" != "$TAG_VERSION" ]; then
            echo "FAIL: sdk/beacon-swift/Sources/PulseBeacon/Types.swift pulseBeaconSDKVersion (${SWIFT_VER}) != tag ($TAG_VERSION)"
            exit 1
          fi

          # 11. Root README image pins — the first thing an evaluator reads;
          #     any stale ams-pulse:<semver> pin fails, not just a missing new one.
          if grep -oE 'ams-pulse:[0-9]+\.[0-9]+\.[0-9]+' README.md | grep -v ":${TAG_VERSION}$" | head -1 | grep -q .; then
            echo "FAIL: README.md contains a stale ams-pulse image pin (want only :${TAG_VERSION})"
            exit 1
          fi

          # 12. Marketplace listing copy version claim (REVIEW-MP3 N8) — the
          #     submission copy names the shipping version in prose.
          if ! grep -q "v${TAG_VERSION}" docs/marketplace/listing.md 2>/dev/null; then
            echo "FAIL: docs/marketplace/listing.md does not mention v${TAG_VERSION} — update the listing copy before tagging"
            exit 1
          fi

          # 13. Helm golden-test values files — stale tags here make the goldens
          #     assert the previous release's pin.
          # Anchored+quoted match: a bare `grep -v 0.4.2` is a SUBSTRING test, so a
          # stale `0.4.20` pin would pass a 0.4.2 release (round-4 review F-14).
          for f in deploy/helm/tests/values-*.yaml; do
            if grep -E '^[[:space:]]*tag:' "$f" | grep -vE "^[[:space:]]*tag:[[:space:]]*\"?${TAG_VERSION}\"?[[:space:]]*$" | head -1 | grep -q .; then
              echo "FAIL: $f pins a tag other than ${TAG_VERSION} — update + regenerate goldens before tagging"
              exit 1
            fi
          done

          # 14. Submission-package index header (REVIEW-MP3-R10) — this is the page
          #     handed to Ant Media; check #3 only reads doc HEADERS in three other
          #     files, so this one drifted to v0.4.1 unnoticed through a whole release.
          PKG_STAMP="$(grep -oE '^\*\*Version:\*\* v[0-9]+\.[0-9]+\.[0-9]+' docs/marketplace/submission-package.md \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [ "$PKG_STAMP" != "$TAG_STAMP" ]; then
            echo "FAIL: docs/marketplace/submission-package.md Version header is '${PKG_STAMP:-<missing>}', expected $TAG_STAMP"
            exit 1
          fi

          # 15. Beacon SDK install instructions (REVIEW-MP3-R10 companion) — customers
          #     follow these verbatim. Advertising an older tarball ships them a known-bad
          #     SDK (0.4.1's Pulse.init() was a silent no-op). Only the install sections
          #     are scanned; the changelogs further down legitimately name old versions.
          for doc in docs/beacon-sdk.md sdk/beacon-js/README.md; do
            if head -120 "$doc" | grep -oE 'ams-pulse-beacon-[0-9]+\.[0-9]+\.[0-9]+\.tgz' \
               | grep -v "ams-pulse-beacon-${TAG_VERSION}.tgz" | head -1 | grep -q .; then
              echo "FAIL: $doc install section advertises a tarball other than ams-pulse-beacon-${TAG_VERSION}.tgz"
              exit 1
            fi
          done

          # 16. Helm chart SEMVER bump when chart content changed (REVIEW-MP3-R8).
          #     'helm push' to an OCI registry OVERWRITES an existing chart version,
          #     so re-publishing 0.3.0 with different templates silently replaces the
          #     artifact someone already pulled. Chart.yaml 'version' is the chart's
          #     own semver and is independent of appVersion (checked at #2).
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            # Fail loudly rather than skipping: a silent no-op here is what let the
            # check pass vacuously on every prior release (round-4 review F-09).
            echo "FAIL: check #16 could not resolve the previous tag — is the checkout shallow or missing tags?"
            exit 1
          fi
          if [ -n "$PREV_TAG" ]; then
            CHART_SEMVER="$(grep -E '^version:' deploy/helm/pulse/Chart.yaml | sed 's/version:[[:space:]]*//; s/"//g')"
            PREV_CHART_SEMVER="$(git show "${PREV_TAG}:deploy/helm/pulse/Chart.yaml" 2>/dev/null \
              | grep -E '^version:' | sed 's/version:[[:space:]]*//; s/"//g' || true)"
            # Scoped to templates/ + values.yaml: check #2 already forces an appVersion
            # bump in Chart.yaml on EVERY release, so diffing all of deploy/helm/pulse/
            # made this check equivalent to "always bump the chart semver" rather than
            # "bump it when the chart's rendered content changed" (round-4 review F-09).
            # Excluding Chart.yaml itself is DELIBERATE (round-5 review G-07): a
            # metadata-only edit there (description, maintainers, a dependency bump)
            # does not change what `helm template` renders, so it does not risk
            # overwriting a published chart and does not need a semver bump.
            if ! git diff --quiet "${PREV_TAG}" "${GITHUB_REF_NAME}" \
                 -- deploy/helm/pulse/templates/ deploy/helm/pulse/values.yaml 2>/dev/null; then
              if [ -n "$PREV_CHART_SEMVER" ] && [ "$CHART_SEMVER" = "$PREV_CHART_SEMVER" ]; then
                echo "FAIL: deploy/helm/pulse/ changed since ${PREV_TAG} but Chart.yaml version is still ${CHART_SEMVER};"
                echo "      pushing it would overwrite the published chart ${CHART_SEMVER} with different content."
                exit 1
              fi
            fi
          fi

          # 17. Image pins in the customer-facing docs (round-5 review G-06).
          #     Checks #5/#8/#11 cover deploy surfaces and the root README, but the
          #     install, troubleshooting and SDK guides sit outside every existing
          #     window — so their `docker pull` examples silently drifted a release
          #     behind. Deliberately reuses check #11's precise pattern
          #     (ams-pulse:<semver>) rather than a bare version grep: prose that
          #     legitimately names an OLD release ("re-verified against 0.4.2") must
          #     not trip this, only a runnable pin that would pull the wrong image.
          #     S122 widened this again, for the third time, and the pattern is now clear
          #     enough to name: every time this check was written as an EXPLICIT FILE LIST,
          #     the next stale pin appeared in a file just outside it. This round it was
          #     deploy/quickstart/.env.example (pinned 0.4.2, three releases behind, in the
          #     file a quickstart user copies) and docs/marketplace/ankush-reply-draft.md
          #     (the message the operator sends Ant Media, which pinned 0.4.4 under prose
          #     claiming v0.4.3 — stale AND self-contradictory). So it is no longer a list:
          #     it scans every tracked Markdown, YAML, env-example and shell file, minus an
          #     explicit exclusion set.
          #
          #     WHAT THIS DOES NOT COVER, deliberately:
          #       - docs/assessment/** and agents/** — dated review records and handoffs.
          #         A historical report pinning 0.4.1 was TRUE when written; forcing it to
          #         the current tag would falsify an audit trail.
          #       - CHANGELOG.md — old entries legitimately name the release they shipped in.
          #     Anything else is in scope. If a new directory needs exempting, add it here
          #     WITH the reason, rather than narrowing the scan back into a file list.
          STALE_PINS=0
          while IFS= read -r f; do
            case "$f" in
              docs/assessment/*|agents/*|CHANGELOG.md) continue ;;
            esac
            [ -f "$f" ] || continue
            BAD="$(grep -oE 'ams-pulse:[0-9]+\.[0-9]+\.[0-9]+' "$f" 2>/dev/null \
                   | grep -v ":${TAG_VERSION}$" | sort -u | tr '\n' ' ')"
            if [ -n "$BAD" ]; then
              echo "FAIL: $f contains a stale ams-pulse image pin: ${BAD}(want only :${TAG_VERSION})"
              STALE_PINS=1
            fi
          done <<EOF
          $(git ls-files '*.md' '*.yml' '*.yaml' '*.sh' '*.example' '.env.example' '**/.env.example')
          EOF
          [ "$STALE_PINS" -eq 0 ] || exit 1
          echo "Image-pin scan: PASS (no stale ams-pulse pins outside the documented exclusions)"

          # 18. RUNNABLE OCI-chart pins in the docs must match the chart's own semver
          #     (D-178). The chart is published to oci://ghcr.io/aytekxr/charts on every
          #     release and is now an advertised install path, so these commands are
          #     copy-pasted by evaluators — a stale pin installs the PREVIOUS chart.
          #     Chart.yaml `version` is the chart semver and moves independently of
          #     appVersion (checked at #2), which is why no existing check covers this.
          #     Scoped to the two runnable forms — `--version X.Y.Z` on a charts/pulse
          #     reference, and a `charts/pulse:X.Y.Z` OCI ref — deliberately NOT a bare
          #     version grep, so prose naming an older chart cannot trip it (the G-06
          #     over-widening warning applies here too).
          CHART_SEMVER_NOW="$(grep -E '^version:' deploy/helm/pulse/Chart.yaml | sed 's/version:[[:space:]]*//; s/"//g')"
          if [ -z "$CHART_SEMVER_NOW" ]; then
            echo "FAIL: check #18 could not read 'version:' from deploy/helm/pulse/Chart.yaml"
            exit 1
          fi
          for f in \
            docs/runbooks/install.md \
            docs/marketplace/listing.md \
            docs/marketplace/submission-package.md \
            deploy/helm/pulse/README.md; do
            [ -f "$f" ] || continue
            STALE="$( { grep -oE 'charts/pulse[^ ]* --version [0-9]+\.[0-9]+\.[0-9]+' "$f" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$'
                        grep -oE 'charts/pulse:[0-9]+\.[0-9]+\.[0-9]+' "$f" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$'
                      } 2>/dev/null | grep -v "^${CHART_SEMVER_NOW}$" | head -1 )"
            if [ -n "$STALE" ]; then
              echo "FAIL: $f pins OCI chart version ${STALE} but deploy/helm/pulse/Chart.yaml is ${CHART_SEMVER_NOW}"
              echo "      An evaluator copy-pasting that command installs the wrong chart."
              exit 1
            fi
          done

          # 19. PROSE release pointers in the root README (round-7 review I-01).
          #     Checks #11/#17 match only runnable `ams-pulse:<semver>` pins — a scoping
          #     round 4 endorsed to avoid false positives — so the README's two English
          #     release pointers sat outside every guard window and shipped one release
          #     stale INSIDE the new submission target, hours after #17 landed.
          #     A customer reading "current: v0.4.3" installs the previous release.
          #     Exact-string match on the two known patterns, not a bare version grep:
          #     prose that legitimately names an older release must still not trip this.
          for pat in "current: \*\*v${TAG_VERSION}\*\*" "latest release \*\*v${TAG_VERSION}\*\*"; do
            if ! grep -qE "$pat" README.md 2>/dev/null; then
              echo "FAIL: README.md is missing the release pointer matching '${pat}'."
              echo "      Found instead: $(grep -oE '(current: |latest release )\*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*' README.md | tr '\n' ' ')"
              echo "      Update the prose pointers to v${TAG_VERSION} before tagging (round-7 I-01)."
              exit 1
            fi
          done
          # And no OTHER version may appear in those two patterns.
          STALE_PTR="$(grep -oE '(current: |latest release )\*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*' README.md 2>/dev/null \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | grep -v "^v${TAG_VERSION}$" | head -1)"
          if [ -n "$STALE_PTR" ]; then
            echo "FAIL: README.md still carries a release pointer for ${STALE_PTR} (tag is v${TAG_VERSION})"
            exit 1
          fi

          echo "Version guard: PASS (VERSION=$FILE_VERSION Chart=$CHART_VERSION chart_semver=$CHART_SEMVER_NOW sdk=$PKG_VERSION swift_sdk=$SWIFT_VER tag=$GITHUB_REF_NAME)"

      # GHCR login is unconditional — dry-run still needs credentials for the
      # local Trivy-scan build step (pulling base layers from GHCR if cached).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch cross-compile support)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Version build args ─────────────────────────────────────────────────────────
      # VERSION : tag name on tag push; inputs.version on dispatch.
      # COMMIT  : first 8 hex chars of GITHUB_SHA.
      # BUILD_DATE: ISO-8601 UTC timestamp.
      # These map to the ARG VERSION / COMMIT / BUILD_DATE in pulse.Dockerfile,
      # wired to -ldflags -X main.Version/GitCommit/BuildDate by the sibling author.
      - name: Compute version build args
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version || '0.0.0-dry' }}"
          fi
          COMMIT="${GITHUB_SHA:0:8}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "VERSION=${VERSION}"
            echo "COMMIT=${COMMIT}"
            echo "BUILD_DATE=${BUILD_DATE}"
          } >> "${GITHUB_OUTPUT}"
          echo "Computed: VERSION=${VERSION} COMMIT=${COMMIT} BUILD_DATE=${BUILD_DATE}"

      # ── Docker metadata ────────────────────────────────────────────────────────────
      # TRAP 1 (workflow_dispatch): semver patterns only fire on tag refs; on a dispatch
      #   run they produce ZERO tags and docker/build-push-action fails with an empty tag
      #   list. Fix: add type=raw,value=<version>,enable=<dispatch-only> so buildx always
      #   receives at least one tag.
      # TRAP 2 (latest): enable={{is_default_branch}} NEVER fires on tag refs (the runner
      #   checks out a detached HEAD, not a branch). Fix: use a raw tag enabled only for
      #   non-prerelease v-tags (ref_name without '-', e.g. v0.1.0 → yes; v0.1.0-rc.1 → no).
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aytekxr/ams-pulse
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.version || '0.0.0-dry' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # ── Dry-run Trivy scan (workflow_dispatch only, no push path) ─────────────────
      # Build amd64 image into the local Docker daemon and scan it.  Skipped on tag
      # push (the pushed multi-arch image is scanned by digest after the push below).
      - name: Build amd64 image for Trivy scan (dry-run only, no push)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/pulse.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/aytekxr/ams-pulse:trivy-scan
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.COMMIT }}
            BUILD_DATE=${{ steps.version.outputs.BUILD_DATE }}

      - name: Trivy vulnerability scan — dry-run local image
        if: github.event_name == 'workflow_dispatch'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/aytekxr/ams-pulse:trivy-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # ── Push multi-arch image under a QUARANTINE tag (tag push only) ───────────────
      # SKIPPED on workflow_dispatch (dry-run): if: github.ref_type == 'tag' ensures
      # the push only happens on actual semver tag refs (v*).
      # linux/amd64 + linux/arm64; provenance + SBOM attached to the manifest.
      #
      # Two-stage publish (REVIEW-MP3 N6): the image is pushed ONLY as
      # candidate-<sha8> first, Trivy-scanned by digest (both arches), and the real
      # tags (X.Y.Z / X.Y / X / latest) are created AFTER the scan passes by
      # re-tagging the same digest. A HIGH/CRITICAL finding therefore never leaves a
      # vulnerable image pullable under a release tag — only the quarantine tag,
      # which evaluators are never pointed at. Provenance/SBOM/cosign all bind to
      # the digest, which promotion does not change.
      - name: Build and push multi-arch image (quarantine tag)
        if: github.ref_type == 'tag'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/pulse.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/aytekxr/ams-pulse:candidate-${{ steps.version.outputs.COMMIT }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.COMMIT }}
            BUILD_DATE=${{ steps.version.outputs.BUILD_DATE }}

      # ── Trivy scan pushed multi-arch image by digest (tag push only) ─────────────
      # Scans the EXACT image users will pull: both amd64 and arm64 platform layers
      # from the pushed manifest digest.  TRIVY_PLATFORM selects the platform-specific
      # layer from the multi-arch index.
      # exit-code: "1" blocks tag promotion on any FIXABLE HIGH/CRITICAL CVE.
      - name: Trivy vulnerability scan — pushed amd64 layer by digest
        if: github.ref_type == 'tag'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ghcr.io/aytekxr/ams-pulse@${{ steps.push.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy vulnerability scan — pushed arm64 layer by digest
        if: github.ref_type == 'tag'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/aytekxr/ams-pulse@${{ steps.push.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # ── Promote the scanned digest to the real release tags ───────────────────────
      # Runs only after BOTH per-arch Trivy scans pass. imagetools create with a
      # single unmodified source re-tags the existing manifest index — the digest
      # (and its attached SBOM/provenance) is byte-identical to what was scanned.
      - name: Promote scanned digest to release tags
        if: github.ref_type == 'tag'
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          echo "Promoting ghcr.io/aytekxr/ams-pulse@${DIGEST}"
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            docker buildx imagetools create -t "$TAG" "ghcr.io/aytekxr/ams-pulse@${DIGEST}"
            echo "promoted: $TAG"
          done <<< "${{ steps.meta.outputs.tags }}"

      # ── Empty the quarantine on a FAILED release (REVIEW-MP3-R7) ──────────────────
      # if: always() — the whole point is the failure path. Without this, a release
      # that Trivy blocked left the vulnerable image publicly pullable forever under
      # candidate-<sha8>; a quarantine that is never emptied is just a second public
      # tag.
      #
      # CRITICAL: a GHCR "package version" is a MANIFEST DIGEST, not a tag, and there
      # is no delete-a-single-tag API. Promotion re-tags the SAME digest, so on the
      # success path this version also carries X.Y.Z / X.Y / X / latest — deleting it
      # would delete the published release along with its SBOM, provenance and cosign
      # signature. So: delete ONLY when the candidate tag is the sole tag on the
      # digest, which is exactly the un-promoted (failed) case.
      #
      # CONSEQUENCE, and it is deliberate (external review round 6, H-09): every
      # SUCCESSFUL release leaves its `candidate-<sha8>` alias publicly visible on the
      # package's versions page, riding the same digest as 0.4.3/latest. A reviewer
      # diffing tags will notice. It is an alias, not a second image — pulling it
      # yields byte-identically the released image.
      #
      # Round 6 proposed "delete the candidate tag on successful promote via the same
      # token path". That is NOT implementable: the endpoint deletes a version (=digest),
      # which on the success path IS the release. Two alternatives were considered and
      # rejected for now:
      #   1. Push candidates to a separate quarantine PACKAGE. Cross-repo promotion
      #      copies the manifest but NOT its referrers, so SBOM and provenance would
      #      silently stop being attached to the released digest — trading a cosmetic
      #      wart for a real supply-chain regression.
      #   2. buildx `push-by-digest=true` (push untagged, tag only after the scan
      #      passes). This is the correct fix and keeps referrers on the same digest,
      #      but it changes the publish mechanism and cannot be exercised by the
      #      dry-run path — only by a real tag. Deferred until after the marketplace
      #      submission rather than altering the release mechanism untested.
      # Until then the alias stays, documented rather than hidden.
      #
      # TOKEN: this needs GHCR_CLEANUP_TOKEN — a PAT with `delete:packages`. The default
      # GITHUB_TOKEN CANNOT do this job (external review round 4, F-07): it is an app
      # installation token with no authenticated-user context, so `/user/packages/...`
      # does not resolve for it, and package-version deletion requires the
      # `delete:packages` scope that `permissions: packages: write` does not grant. With
      # GITHUB_TOKEN the LIST call returned empty and the step exited 0 via the
      # "nothing to clean up" branch — reporting success while never deleting anything.
      # So: when the PAT is absent, say so loudly instead of silently no-opping.
      - name: Empty quarantine on failure
        if: always() && github.ref_type == 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          CANDIDATE: candidate-${{ steps.version.outputs.COMMIT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set +e
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::GHCR_CLEANUP_TOKEN is not configured, so the quarantine tag ${CANDIDATE} cannot be deleted automatically. If this release FAILED before promotion, an unscanned image is publicly pullable under that tag — delete it by hand: GitHub → Packages → ams-pulse → versions. (Add a PAT with delete:packages as GHCR_CLEANUP_TOKEN to automate this.)"
            exit 0
          fi

          # /users/{owner}/... is the correct endpoint for a PAT acting on a
          # user-owned package; /user/... only works for the token's own identity.
          # NOTE (round-5 review G-07): if this package ever moves to an ORG, this
          # becomes /orgs/{org}/packages/... — the call would 404 and hit the loud
          # warning below rather than failing silently, but change it at move time.
          if ! VERSIONS=$(gh api "/users/${OWNER}/packages/container/ams-pulse/versions" --paginate 2>&1); then
            echo "::warning::could not list package versions (${VERSIONS}); delete quarantine tag ${CANDIDATE} by hand if this release failed"
            exit 0
          fi

          VERSION_JSON=$(echo "$VERSIONS" | jq -c ".[] | select(.metadata.container.tags[]? == \"${CANDIDATE}\")" 2>/dev/null | head -1)
          if [ -z "$VERSION_JSON" ]; then
            echo "::notice::quarantine tag ${CANDIDATE} not found — nothing to clean up"
            exit 0
          fi
          VERSION_ID=$(echo "$VERSION_JSON" | jq -r '.id')
          TAG_COUNT=$(echo "$VERSION_JSON" | jq -r '.metadata.container.tags | length')
          ALL_TAGS=$(echo "$VERSION_JSON" | jq -r '.metadata.container.tags | join(",")')

          if [ "$TAG_COUNT" != "1" ]; then
            echo "::notice::digest also carries release tags (${ALL_TAGS}) — promotion succeeded, leaving it untouched (deleting the version would delete the release)"
            exit 0
          fi

          # Assert the HTTP status so a silent auth failure cannot read as success.
          HTTP_CODE=$(gh api -X DELETE "/users/${OWNER}/packages/container/ams-pulse/versions/${VERSION_ID}" \
            --include --silent 2>&1 | grep -oiE '^HTTP/[0-9.]+ [0-9]+' | grep -oE '[0-9]+$' | head -1)
          if [ "$HTTP_CODE" = "204" ]; then
            echo "release failed before promotion — deleted un-promoted quarantine image ${CANDIDATE}"
          else
            echo "::warning::could not delete un-promoted quarantine image ${CANDIDATE} (version id ${VERSION_ID}, HTTP ${HTTP_CODE:-unknown}); a vulnerable image may be publicly pullable — delete it by hand: GitHub → Packages → ams-pulse → versions"
          fi

      # ── cosign keyless signing (tag push only) ─────────────────────────────────────
      # SKIPPED on workflow_dispatch (dry-run): same if condition as push step.
      # Signs the immutable manifest digest (not the mutable tag name) using the
      # GitHub Actions OIDC token — no long-lived key material stored anywhere.
      #
      # Verify a released image:
      #   cosign verify \
      #     --certificate-identity-regexp '^https://github\.com/aytekXR/ams-pulse/\.github/workflows/release\.yml@refs/tags/v.+$' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     ghcr.io/aytekxr/ams-pulse:X.Y.Z    # image tags have NO v prefix (see header)
      #   The anchoring is load-bearing — see the header note (H-05).
      #
      # ⚠ The verifier needs cosign v3+ — see the header note (D-178). Do NOT "fix" a
      # v2 client's "no signatures found" by re-signing in legacy tag mode without
      # deciding that deliberately: the referrer layout is the OCI 1.1 standard
      # direction, and switching back would silently change what every downstream
      # verifier has to look for.
      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with cosign (keyless / Sigstore OIDC)
        if: github.ref_type == 'tag'
        run: |
          cosign sign --yes \
            "ghcr.io/aytekxr/ams-pulse@${{ steps.push.outputs.digest }}"

      # ── Pulse binaries (tag push only) ────────────────────────────────────────────
      # Builds static linux/amd64 + linux/arm64 pulse binaries (CGO_ENABLED=0; the
      # sqlite driver is pure-Go modernc.org/sqlite — no C runtime needed).
      # SHA256SUMS is NOT written here: it covers ALL FOUR release assets and is
      # therefore generated after the SDK tarball and Helm chart exist, in the
      # "Checksum all release assets" step below (review round 6, H-03).
      - name: Set up Go for binary builds
        if: github.ref_type == 'tag'
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build pulse binaries
        if: github.ref_type == 'tag'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          COMMIT="${{ steps.version.outputs.COMMIT }}"
          BUILD_DATE="${{ steps.version.outputs.BUILD_DATE }}"
          LDFLAGS="-X main.Version=${VERSION} -X main.GitCommit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"
          cd server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags "$LDFLAGS" \
            -o ../pulse-linux-amd64 ./cmd/pulse/
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags "$LDFLAGS" \
            -o ../pulse-linux-arm64 ./cmd/pulse/
          cd ..
          ls -l pulse-linux-amd64 pulse-linux-arm64

      # ── SDK tarball + Helm chart + GitHub Release (tag push only) ──────────────────
      # Builds the beacon-js SDK, packs it, creates the GitHub Release (if it doesn't
      # exist), and uploads the SDK tarball, pulse binaries, SHA256SUMS, and Helm chart.
      - name: Build SDK tarball and upload to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd sdk/beacon-js
          npm ci
          npm run build
          TARBALL=$(npm pack 2>/dev/null)
          echo "Packed: $TARBALL"
          cd ../..

          # Create the GitHub Release if it doesn't already exist.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

          # Upload the SDK tarball, overwriting any existing asset with the same name.
          gh release upload "${GITHUB_REF_NAME}" \
            "sdk/beacon-js/${TARBALL}" \
            --clobber
          echo "Uploaded sdk/beacon-js/${TARBALL} to release ${GITHUB_REF_NAME}"

          # Upload pulse binaries built above. SHA256SUMS is uploaded later, once
          # every asset it covers exists (review round 6, H-03).
          gh release upload "${GITHUB_REF_NAME}" \
            pulse-linux-amd64 \
            pulse-linux-arm64 \
            --clobber
          echo "Uploaded pulse-linux-amd64, pulse-linux-arm64 to release ${GITHUB_REF_NAME}"

      # ── Helm chart — package, push to OCI registry, attach to release ──────────────
      - name: Install Helm for chart packaging
        if: github.ref_type == 'tag'
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      - name: Package and publish Helm chart
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          helm package deploy/helm/pulse/
          CHART_TGZ=$(find . -maxdepth 1 -name 'pulse-*.tgz' | head -1)
          echo "Packed chart: $CHART_TGZ"

          # Push chart to OCI registry (oci://ghcr.io/aytekxr/charts).
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          helm push "$CHART_TGZ" oci://ghcr.io/aytekxr/charts

          # Also attach the chart .tgz to the GitHub Release for offline installs.
          gh release upload "${GITHUB_REF_NAME}" "$CHART_TGZ" --clobber
          echo "Helm chart pushed to oci://ghcr.io/aytekxr/charts and attached to ${GITHUB_REF_NAME}"

      # ── SHA256SUMS over EVERY downloadable asset (tag push only) ──────────────────
      # Review round 6 (H-03): SHA256SUMS used to cover only the two binaries, so the
      # beacon SDK tarball a player team embeds and the Helm chart an operator installs
      # shipped with no published checksum at all. It runs LAST because it must checksum
      # artifacts the earlier steps produce.
      #
      # Filenames are written bare (no directory component) so that a user who downloads
      # all five assets into one directory can run `sha256sum -c SHA256SUMS` unmodified —
      # which is exactly what docs/runbooks/install.md now tells them to do.
      #
      # The line-count assertion is the point of the step: without it, a silently missing
      # artifact would republish a short SHA256SUMS and read as success — the defect this
      # finding was about in the first place.
      - name: Checksum all release assets and upload SHA256SUMS
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _sums && mkdir _sums
          cp pulse-linux-amd64 pulse-linux-arm64 _sums/
          cp sdk/beacon-js/ams-pulse-beacon-*.tgz _sums/
          cp pulse-[0-9]*.tgz _sums/          # Helm chart (pulse-<chartversion>.tgz)
          cd _sums
          sha256sum pulse-linux-amd64 pulse-linux-arm64 ams-pulse-beacon-*.tgz pulse-[0-9]*.tgz > SHA256SUMS

          COUNT=$(wc -l < SHA256SUMS)
          if [ "$COUNT" -ne 4 ]; then
            echo "::error::SHA256SUMS covers ${COUNT} assets, expected 4 (2 binaries + SDK tarball + Helm chart)"
            cat SHA256SUMS
            exit 1
          fi
          # Prove the file verifies before publishing it.
          sha256sum -c SHA256SUMS
          echo "SHA256SUMS (${COUNT} assets):"
          cat SHA256SUMS

          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber
          echo "Uploaded SHA256SUMS covering ${COUNT} assets to release ${GITHUB_REF_NAME}"

      # ── npm publish (gated on NPM_TOKEN; never blocks the release) ────────────────
      # Step 1: probe whether the secret is present and write a step output.
      # Step 2: publish only when the output is 'true'.
      # Missing token logs a notice and falls through — it does NOT fail the job.
      - name: Check npm publish credentials
        id: npm-creds
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret not set — skipping npm publish; set NPM_TOKEN to enable"
          fi

      - name: Publish to npm registry
        if: steps.npm-creds.outputs.available == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Configure npm to use the registry auth token.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          cd sdk/beacon-js
          npm publish --provenance --access public
          echo "Published ams-pulse-beacon to npm registry"

      - name: Notify Slack on success
        if: success()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          MSG=${MSG:-"(no commit message)"}
          TEXT=$(printf '✅ Build succeeded\n\nRepo: %s\nWorkflow: %s\nTime: %s\nCommit: %s - %s' \
            "${GITHUB_REPOSITORY##*/}" "$GITHUB_WORKFLOW" "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "${GITHUB_SHA:0:7}" "$MSG")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- \
              "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack success notification failed"

      - name: Notify Slack on failure
        if: failure()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          MSG=${MSG:-"(no commit message)"}
          TEXT=$(printf '❌ Build failed\n\nRepo: %s\nWorkflow: %s\nJob: %s\nBranch: %s\nActor: %s\nCommit: %s - %s\nRun: %s\nTime: %s' \
            "${GITHUB_REPOSITORY##*/}" "$GITHUB_WORKFLOW" "$GITHUB_JOB" "$GITHUB_REF_NAME" "$GITHUB_ACTOR" \
            "${GITHUB_SHA:0:7}" "$MSG" \
            "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- \
              "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack failure notification failed"
