{{- if .Values.clickhouse.enabled -}}
# ClickHouse low-footprint configuration for 2-vCPU Free-tier installs.
# Memory limits, concurrency caps, and cache sizes are tuned conservatively
# for the PRD §7.10 deployment target: 2 vCPU, 2–4 GB RAM sidecar.
# Adjust clickhouse.config values in values.yaml for larger installs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse.fullname" . }}-clickhouse-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  config.xml: |
    <clickhouse>
      <!-- Storage path — mounted from PVC -->
      <path>/var/lib/clickhouse/</path>
      <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>
      <user_data_path>/var/lib/clickhouse/user_data/</user_data_path>

      <!-- Ports -->
      <tcp_port>9000</tcp_port>
      <http_port>8123</http_port>
      <interserver_http_port>9009</interserver_http_port>

      <!-- Listen on all interfaces inside the pod -->
      <listen_host>0.0.0.0</listen_host>

      <!-- Logging: errors only to reduce I/O on small VMs -->
      <logger>
        <level>error</level>
        <console>1</console>
      </logger>

      <!-- Low-footprint memory limits (2-vCPU tier).
           max_server_memory_usage is the SERVER-WIDE cap and must be larger than
           the per-query max_memory_usage set in the profile below. It was wired to
           maxMemoryUsage (the per-query value), making the chart's server cap
           512 MB against the compose XML's 768 MB despite the XML claiming parity
           (REVIEW-MP3-R4). maxMemoryUsageForAllQueries is the legacy name for this
           value — the ClickHouse setting it used to render is deprecated in 24.x.
           Precedence: new key → deprecated alias → built-in 768 MB default. The default
           lives HERE rather than in values.yaml because a chart default is never empty,
           which would make the alias fallback unreachable (round-4 review F-09). -->
      <max_server_memory_usage>{{ .Values.clickhouse.config.maxServerMemoryUsage | default .Values.clickhouse.config.maxMemoryUsageForAllQueries | default "805306368" }}</max_server_memory_usage>
      <max_concurrent_queries>{{ .Values.clickhouse.config.maxConcurrentQueries }}</max_concurrent_queries>
      <uncompressed_cache_size>{{ .Values.clickhouse.config.uncompressedCacheSize }}</uncompressed_cache_size>
      <mark_cache_size>{{ .Values.clickhouse.config.markCacheSize }}</mark_cache_size>

      <!-- Background pool sizing -->
      <background_pool_size>{{ .Values.clickhouse.config.backgroundPoolSize }}</background_pool_size>
      <background_schedule_pool_size>{{ .Values.clickhouse.config.backgroundSchedulePoolSize }}</background_schedule_pool_size>

      <!-- max_threads is a QUERY-level setting and is set in the default profile
           in users.xml below. ClickHouse silently IGNORES it at the bare
           <clickhouse> root, so setting it here did nothing (REVIEW-MP3-R4) —
           the same defect already fixed in deploy/config/clickhouse-low-footprint.xml. -->

      <!-- Users config loaded from separate ConfigMap key -->
      <users_config>/etc/clickhouse-server/users.xml</users_config>
    </clickhouse>

  users.xml: |
    <clickhouse>
      <profiles>
        <default>
          <!-- Query-level settings must live in a profile to take effect. -->
          <max_memory_usage>{{ .Values.clickhouse.config.maxMemoryUsage }}</max_memory_usage>
          <max_threads>{{ .Values.clickhouse.config.maxThreads }}</max_threads>
        </default>
      </profiles>
      <users>
        <default>
          {{- if .Values.clickhouse.auth.existingSecret }}
          <!-- Named user provisioned via CLICKHOUSE_USER + CLICKHOUSE_PASSWORD env vars at first boot. -->
          <!-- The default user is restricted to localhost; readiness probes run in-pod so they work. -->
          <password></password>
          <profile>default</profile>
          <quota>default</quota>
          <networks>
            <ip>127.0.0.1</ip>
            <ip>::1</ip>
          </networks>
          <access_management>0</access_management>
          {{- else }}
          <!-- DEVELOPMENT/TEST ONLY: no password. Set clickhouse.auth.existingSecret in production. -->
          <password></password>
          <profile>default</profile>
          <quota>default</quota>
          <networks>
            <ip>::/0</ip>
          </networks>
          <access_management>1</access_management>
          {{- end }}
        </default>
      </users>
      <quotas>
        <default></default>
      </quotas>
    </clickhouse>
  {{- if .Values.backup.enabled }}
  backup-config.xml: |
    <!-- ClickHouse backup disk config — enables BACKUP DATABASE ... TO Disk('backups', ...) SQL. -->
    <!-- Mirrors deploy/config/clickhouse-backups.xml from the compose backup overlay. -->
    <clickhouse>
      <storage_configuration>
        <disks>
          <backups>
            <type>local</type>
            <path>/backups/</path>
          </backups>
        </disks>
      </storage_configuration>
      <backups>
        <allowed_disk>backups</allowed_disk>
      </backups>
    </clickhouse>
  {{- end }}
{{- end }}
