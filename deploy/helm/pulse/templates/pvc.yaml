{{- if .Values.pulse.persistence.enabled -}}
# PVC for pulse data: license cache, report artifacts, and SQLite meta store.
# Created whenever persistence.enabled — data volume is needed regardless of meta-store backend.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pulse.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: pulse
spec:
  accessModes:
    - {{ .Values.pulse.persistence.accessMode }}
  {{- if .Values.pulse.persistence.storageClass }}
  storageClassName: {{ .Values.pulse.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.pulse.persistence.size }}
{{- end }}
