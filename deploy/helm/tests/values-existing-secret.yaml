# Test values: ClickHouse auth via existingSecret.
# Locks the fix for the configmap-clickhouse.yaml existingSecret branch that now
# restricts the default user to localhost only (127.0.0.1 and ::1) with
# access_management 0. Covers Issue H from the S106 review.
# Used by: helm template golden-file test (diffed against its golden in the ci.yml helm job).

clickhouse:
  auth:
    existingSecret: pulse-clickhouse-secret

pulse:
  image:
    repository: ghcr.io/aytekxr/ams-pulse
    tag: "0.4.2"
  ams:
    url: "http://ams.example.com:5080"
    nodeId: "node-01"
  secretRef:
    name: pulse-secrets
