# Pulse — self-hosted deployment bundle (PRD §7.10).
# Installs beside AMS or on a dedicated VM. Target: `docker compose up -d`
# to a working dashboard in under 15 minutes, including AMS source setup.
#
# Two containers only — pulse (all-in-one binary, serves UI+API+ingest) and
# ClickHouse. Metadata store is embedded SQLite on the pulse volume by default.
# Base image digests pinned 2026-06-11 via registry HTTP API (no Docker daemon).
#
# Wave-2 changes:
#   - Full PULSE_* env surface wired (ingest, webhook, meta DSN, license, S3)
#   - Beacon ingest port 8091 exposed (internet-facing; put TLS terminator in front)
#   - PULSE_CLICKHOUSE_DSN replaces defunct PULSE_CLICKHOUSE_ADDR
#   - PULSE_AMS_AUTH_TOKEN included (required for non-anonymous AMS installs)
#   - Volumes: pulse-data now covers SQLite meta + secret key file
#   - mmdb and log-tail volume mount stubs documented
#   - Healthchecks on both containers

name: pulse

services:
  # One-shot ClickHouse/meta schema migration. Runs to completion before pulse
  # starts (see depends_on below). Migration SQL is baked into the image at
  # /usr/share/pulse/migrations (D-089) — no repo checkout needed at runtime.
  # S105: this service used to live only in docker-compose.override.yml (auto-
  # loaded only when compose runs from deploy/ with no -f), so the documented
  # `docker compose -f deploy/docker-compose.yml up -d` path booted an
  # unmigrated ClickHouse. It belongs in the base file.
  pulse-migrate:
    image: ${PULSE_IMAGE:-ghcr.io/aytekxr/ams-pulse:0.4.4}
    entrypoint: ["pulse", "migrate"]
    restart: "no"
    environment:
      PULSE_CLICKHOUSE_DSN: "clickhouse://clickhouse:9000/pulse"
      PULSE_CLICKHOUSE_DATABASE: "pulse"
      PULSE_MIGRATIONS_DIR: "/usr/share/pulse/migrations"
      PULSE_META_DSN: "/var/lib/pulse/pulse_meta.db"
      # D-052 fail-closed guard: migrate refuses to boot without a >=16-byte key.
      PULSE_SECRET_KEY: "${PULSE_SECRET_KEY:-}"
    volumes:
      - pulse-data:/var/lib/pulse
    depends_on:
      clickhouse:
        condition: service_healthy

  pulse:
    # Default: the cosign-signed published image (cosign/SBOM — see README).
    # To build from source instead, add: -f deploy/docker-compose.build.yml --build
    image: ${PULSE_IMAGE:-ghcr.io/aytekxr/ams-pulse:0.4.4}
    expose:
      - "8090"    # UI + API — publish via an override (demo/CI) or a reverse proxy
      - "8091"    # Beacon ingest — publish via an override or TLS-terminating proxy
      - "8092"    # Webhook ingest — active when PULSE_WEBHOOK_SECRET is set (hardened overlay)
    environment:
      # ── Core server ──────────────────────────────────────────────────────────
      PULSE_LISTEN_ADDR: ":8090"
      # Dedicated beacon ingest listener — must match the exposed 8091 above and
      # the edge /beacon/* upstream (deploy/nginx/pulse.beyondkaira.com.conf).
      # Without it serve.go never binds 8091 and the public beacon URL 502s
      # (found by D-058 staging verify).
      PULSE_INGEST_LISTEN_ADDR: ":8091"
      PULSE_LOG_LEVEL: "info"

      # ── ClickHouse ───────────────────────────────────────────────────────────
      # PULSE_CLICKHOUSE_ADDR is NOT a valid env var; use PULSE_CLICKHOUSE_DSN.
      PULSE_CLICKHOUSE_DSN: "clickhouse://clickhouse:9000/pulse"
      PULSE_CLICKHOUSE_DATABASE: "pulse"
      PULSE_RETENTION_DAYS: "90"
      PULSE_ROLLUP_TTL_DAYS: "395"

      # ── AMS source ───────────────────────────────────────────────────────────
      PULSE_AMS_URL: "${PULSE_AMS_URL:-http://host.docker.internal:5080}"
      PULSE_AMS_NODE_ID: "standalone"
      PULSE_POLL_INTERVAL: "5s"
      # PULSE_AMS_APPLICATIONS: "live,vod"   # comma-separated; empty = all apps

      # ── Sensitive values — substituted from deploy/.env (compose loads the
      #    .env next to this file automatically; see deploy/.env.example).
      #    Empty values are treated as unset by the server. S105: these were
      #    previously commented out, so a value set in deploy/.env silently
      #    never reached the container and pulse fail-closed at boot on the
      #    missing PULSE_SECRET_KEY.
      PULSE_SECRET_KEY: "${PULSE_SECRET_KEY:-}"           # 32-byte hex — REQUIRED
      PULSE_AMS_AUTH_TOKEN: "${PULSE_AMS_AUTH_TOKEN:-}"   # static-token AMS auth
      PULSE_AMS_LOGIN_EMAIL: "${PULSE_AMS_LOGIN_EMAIL:-}" # cookie-session AMS auth
      PULSE_AMS_LOGIN_PASSWORD: "${PULSE_AMS_LOGIN_PASSWORD:-}"
      PULSE_LICENSE_KEY: "${PULSE_LICENSE_KEY:-}"         # empty = Free tier
      # PULSE_WEBHOOK_ADDR: ":8092"      # optional webhook HTTP listener
      # PULSE_WEBHOOK_SECRET: ""         # HMAC-SHA256 secret for AMS webhook

      # ── Meta store ───────────────────────────────────────────────────────────
      PULSE_META_DSN: "/var/lib/pulse/pulse_meta.db"
      # Use postgres for HA deployments:
      # PULSE_META_DSN: "postgres://pulse:password@postgres:5432/pulse_meta"

      # ── Reports ──────────────────────────────────────────────────────────────
      # Persist generated report artifacts on the pulse-data volume (D-142/D-143).
      # The code default is the RELATIVE "pulse-reports", which resolves to the
      # ephemeral container root (WORKDIR "/") and is wiped on every redeploy; the
      # volume path also lets PULSE_REPORT_ARTIFACT_RETENTION_DAYS pruning (default
      # 90; 0 disables) actually bound growth across restarts.
      PULSE_REPORTS_DIR: "/var/lib/pulse/reports"
      # PULSE_REPORT_ARTIFACT_RETENTION_DAYS: "90"

      # ── License ──────────────────────────────────────────────────────────────
      # PULSE_LICENSE_KEY: ""            # empty = Free tier (1 node, 7-day retention)
      # PULSE_LICENSE_FILE: /etc/pulse/license.sig   # air-gapped Enterprise

      # ── S3 export (Wave 2 — CSV/PDF report storage) ──────────────────────────
      # PULSE_S3_EXPORT_KEY_ID: ""
      # PULSE_S3_EXPORT_SECRET_KEY: ""
      # PULSE_S3_EXPORT_BUCKET: ""
      # PULSE_S3_EXPORT_REGION: "us-east-1"

      # ── Prometheus /metrics token (Wave 2) ───────────────────────────────────
      # PULSE_METRICS_TOKEN: ""          # set to require scrape authentication

    volumes:
      - pulse-data:/var/lib/pulse         # SQLite meta store + secret key cache
      # Mount MaxMind mmdb for geo enrichment (Wave 2):
      # - /etc/pulse/GeoLite2-City.mmdb:/var/lib/pulse/GeoLite2-City.mmdb:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      pulse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  clickhouse:
    # clickhouse/clickhouse-server:24.8
    # Digest pinned 2026-06-11 via registry HTTP API (no Docker daemon).
    # ⚠️ NEVER mount contracts/db/clickhouse/ as /docker-entrypoint-initdb.d/:
    # the DDL contains {db} placeholders that only the pulse-migrate runner
    # substitutes; raw ClickHouse aborts on the first statement (Code 62
    # SYNTAX_ERROR) and applies NO tables at all (D-065 WO-D). Schema is applied
    # exclusively by the pulse-migrate one-shot container.
    image: clickhouse/clickhouse-server@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Optional low-footprint config (2-vCPU tuning) — the file exists at
      # deploy/config/clickhouse-low-footprint.xml; uncomment to activate:
      # - ./config/clickhouse-low-footprint.xml:/etc/clickhouse-server/config.d/pulse.xml:ro
    environment:
      # ClickHouse 24.8 disables network access for the default user unless
      # CLICKHOUSE_USER/PASSWORD are set — which caused code 516:
      # Authentication failed while the local healthcheck passed (C/D-xxx).
      # SKIP_USER_SETUP=1 keeps the built-in permissive default; safe here
      # because CH ports are expose:-only, never published to the host.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    expose:
      - "9000"    # ClickHouse native protocol (cluster-internal only)
      - "8123"    # ClickHouse HTTP (cluster-internal only)
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped

volumes:
  pulse-data:
  clickhouse-data:
