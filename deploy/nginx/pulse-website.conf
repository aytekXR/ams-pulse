# =============================================================================
# nginx site — Pulse public website (static marketing/docs site).
#
# This serves the static files from website/ at a custom domain. The site is
# also deployed to GitHub Pages (aytekxr.github.io/ams-pulse/) — this config
# is for operators who prefer to self-host or need a custom domain.
#
# SCOPE. This is a STATIC site — no app backend, no upstream, no proxy. nginx
# serves files directly from disk with aggressive caching and a strict CSP.
#
# CSP POLICY. The CSP here enforces the same "no external assets" rule that
# the CI checks (website/tests/run-checks.sh) validate at build time. If a
# page references an external script, style, font, or image, nginx will block
# it and the browser console will report a CSP violation. This is deliberate —
# the architecture rule (docs/ARCHITECTURE.md section 3) forbids external
# network assets.
#
# Install (sudo required):
#   # 1. Copy static files to webroot
#   sudo install -d /var/www/pulse-website
#   sudo cp -r website/* /var/www/pulse-website/
#
#   # 2. Install nginx config
#   sudo cp deploy/nginx/pulse-website.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/pulse-website.conf /etc/nginx/sites-enabled/
#
#   # 3. Obtain certificate (replace DOMAIN with your domain)
#   sudo certbot certonly --webroot -w /var/www/certbot -d DOMAIN
#
#   # 4. Update server_name and ssl_certificate paths below
#
#   # 5. Test and reload
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Port 80: ACME HTTP-01 challenge for certificate renewal, redirect all else.
server {
    listen 80;
    listen [::]:80;
    # TODO: Replace with your domain
    server_name pulse.example.com;

    # HTTP-01 webroot carve-out (certbot --webroot -w /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # TODO: Replace with your domain
    server_name pulse.example.com;

    # TODO: Update paths to your certificate
    ssl_certificate     /etc/letsencrypt/live/pulse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    # ── Security headers ─────────────────────────────────────────────────────
    # Mirrors the app's header policy (pulse.beyondkaira.com.conf) but with a
    # stricter CSP since this is a static site with no API or WebSocket.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP: self-contained, no external assets. This enforces:
    #   - default-src 'self': only same-origin by default
    #   - script-src 'self': scripts must be self-hosted (no CDN)
    #   - style-src 'self' 'unsafe-inline': self-hosted CSS + inline styles
    #   - img-src 'self' data:: self-hosted images + data URIs
    #   - font-src 'self': self-hosted fonts only (no Google Fonts)
    #   - connect-src 'none': no fetch/XHR/WebSocket (static site)
    #   - object-src 'none': no plugins
    #   - base-uri 'self': prevent base-tag hijacking
    #   - frame-ancestors 'none': prevent framing (clickjacking)
    #   - form-action 'self': forms submit only to same origin
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    access_log /var/log/nginx/pulse-website.access.log;
    error_log  /var/log/nginx/pulse-website.error.log;

    root /var/www/pulse-website;
    index index.html;

    # ── Static file serving ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ── Cache policy ─────────────────────────────────────────────────────────
    # HTML: short cache (pages may update frequently)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
        # Re-add security headers (add_header in location clears parent headers)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # Immutable assets: long cache (CSS, JS, images, fonts with hashed names)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-add security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
